<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b36">
<title>Spanish Golf Tour 2026 — Photos Prototype V2</title>

<style>
:root{
  --navy:#0d1b36;
  --navy2:#071522;
  --cream:#f4eddf;
  --teal:#1aa0a4;
  --orange:#f36b18;
  --line:rgba(13,27,54,.14);
  --muted:#6e7681;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy2);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}
body{min-height:100vh}
.app{max-width:680px;margin:0 auto;background:var(--cream);min-height:100vh}

.hero{
  background:linear-gradient(180deg,#112844 0%,#0d1b36 100%);
  color:white;
  border-bottom:3px solid var(--orange);
  padding:14px 16px 12px;
}
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:24px;line-height:1}
.hero small{display:block;margin-top:5px;color:#c8d2dc;font-weight:800}
.home{
  min-width:44px;min-height:44px;border:2px solid var(--teal);border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;
  font-size:20px;font-weight:900
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px;
  background:#fbf7ef;
  border-bottom:1px solid var(--line)
}
.actions button{
  min-height:50px;
  border-radius:10px;
  border:2px solid var(--teal);
  font-size:14px;
  font-weight:900
}
.primary{background:var(--teal);color:white}
.secondary{background:transparent;color:var(--navy)}

.filters{
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--cream);
  border-bottom:1px solid var(--line);scrollbar-width:none
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid #bac3ca;background:#fffaf1;color:var(--navy);
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900
}
.chip.active{background:var(--navy);color:white;border-color:var(--navy)}

.gallery{
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#e9e2d7
}
.tile{
  position:relative;aspect-ratio:1/1;border:0;padding:0;overflow:hidden;background:#d2d8dc;
  cursor:pointer
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{
  position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;
  color:white;font-size:10px;font-weight:900;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.72))
}
.tile.placeholder:nth-child(4n+1){background:linear-gradient(135deg,#6a8fad,#d8c29e)}
.tile.placeholder:nth-child(4n+2){background:linear-gradient(135deg,#407d70,#d6b268)}
.tile.placeholder:nth-child(4n+3){background:linear-gradient(135deg,#8b6d8f,#d8b9a4)}
.tile.placeholder:nth-child(4n+4){background:linear-gradient(135deg,#50698c,#9fc7c9)}
.placeholderIcon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:34px;opacity:.85
}

.emptyNote{
  padding:12px 14px;background:#fffaf1;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;font-weight:800;line-height:1.35
}

.modal{
  position:fixed;inset:0;background:rgba(2,9,16,.82);display:none;align-items:flex-end;
  justify-content:center;z-index:20
}
.modal.open{display:flex}
.sheet{
  width:min(100%,680px);background:var(--cream);border-radius:18px 18px 0 0;
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))
}
.sheet h2{margin:0 0 12px;font-size:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:900;letter-spacing:.4px;margin-bottom:6px}
.field select,.field input[type="text"]{
  width:100%;min-height:46px;border:2px solid #c8d0d6;border-radius:9px;background:white;
  padding:8px 10px;font-size:16px
}
.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetBtns button{min-height:48px;border-radius:10px;font-weight:900;font-size:15px}
.cancel{background:transparent;border:2px solid var(--teal);color:var(--navy)}
.add{background:var(--teal);border:2px solid var(--teal);color:white}
.note{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.35}

.lightbox{
  position:fixed;inset:0;background:#02070c;display:none;z-index:30;
  align-items:center;justify-content:center;padding:18px
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}
.lightboxClose{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
  width:46px;height:46px;border-radius:50%;border:2px solid white;background:rgba(0,0,0,.4);
  color:white;font-size:24px;font-weight:900
}
.lightboxCaption{
  position:absolute;left:14px;right:60px;bottom:calc(12px + env(safe-area-inset-bottom));
  color:white;font-weight:800;font-size:13px
}

.hiddenInput{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

@media(max-width:360px){
  .gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="heroRow">
      <div>
        <h1>Tour Photos</h1>
        <small>Spanish Golf Tour 2026</small>
      </div>
      <a class="home" href="index.html" aria-label="Main Menu">⌂</a>
    </div>
  </header>

  <section class="actions">
    <button id="takePhotoBtn" class="primary" type="button">📷 TAKE PHOTO</button>
    <button id="choosePhotosBtn" class="secondary" type="button">🖼️ CHOOSE PHOTOS</button>
  </section>

  <nav class="filters" aria-label="Photo filters">
    <button class="chip active" data-filter="all" type="button">ALL</button>
    <button class="chip" data-filter="round1" type="button">ROUND 1</button>
    <button class="chip" data-filter="round2" type="button">ROUND 2</button>
    <button class="chip" data-filter="offcourse" type="button">OFF COURSE</button>
    <button class="chip" data-filter="travel" type="button">TRAVEL</button>
  </nav>

  <main id="gallery" class="gallery" aria-live="polite">
    <button class="tile placeholder" data-category="round1" type="button">
      <span class="placeholderIcon">⛳</span>
      <span class="meta">Round 1 · Las Brisas</span>
    </button>
    <button class="tile placeholder" data-category="offcourse" type="button">
      <span class="placeholderIcon">🍻</span>
      <span class="meta">Off Course · Marbella</span>
    </button>
    <button class="tile placeholder" data-category="round2" type="button">
      <span class="placeholderIcon">🏌️</span>
      <span class="meta">Round 2 · Golf</span>
    </button>
    <button class="tile placeholder" data-category="travel" type="button">
      <span class="placeholderIcon">✈️</span>
      <span class="meta">Travel · Arrival</span>
    </button>
    <button class="tile placeholder" data-category="round1" type="button">
      <span class="placeholderIcon">🏆</span>
      <span class="meta">Round 1 · Leaderboard moment</span>
    </button>
    <button class="tile placeholder" data-category="offcourse" type="button">
      <span class="placeholderIcon">🍽️</span>
      <span class="meta">Off Course · Dinner</span>
    </button>
  </main>

  <div class="emptyNote">
    Prototype V2: camera and gallery picker are live. Selected images are still preview-only and are not yet uploaded to Google Drive.
  </div>
</div>

<input id="cameraInput" class="hiddenInput" type="file" accept="image/*" capture="environment">
<input id="galleryInput" class="hiddenInput" type="file" accept="image/*" multiple>

<div id="uploadModal" class="modal" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
    <h2 id="uploadTitle">Add Tour Photos</h2>

    <div class="field">
      <label for="event">EVENT / ROUND</label>
      <select id="event">
        <option value="round1">Round 1 · Las Brisas</option>
        <option value="round2">Round 2</option>
        <option value="offcourse">Off Course</option>
        <option value="travel">Travel</option>
      </select>
    </div>

    <div class="field">
      <label for="caption">CAPTION · OPTIONAL</label>
      <input id="caption" type="text" maxlength="80" placeholder="e.g. PGB escapes the bunker">
    </div>

    <div class="sheetBtns">
      <button id="cancelBtn" class="cancel" type="button">CANCEL</button>
      <button id="addBtn" class="add" type="button">ADD TO GALLERY</button>
    </div>

    <p id="selectionNote" class="note">No photo selected.</p>
  </section>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button id="lightboxClose" class="lightboxClose" type="button" aria-label="Close">×</button>
  <img id="lightboxImg" alt="">
  <div id="lightboxCaption" class="lightboxCaption"></div>
</div>

<script>
const gallery=document.getElementById('gallery');
const uploadModal=document.getElementById('uploadModal');
const cameraInput=document.getElementById('cameraInput');
const galleryInput=document.getElementById('galleryInput');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
const lightboxCaption=document.getElementById('lightboxCaption');
const selectionNote=document.getElementById('selectionNote');

let pendingFiles=[];

function openUpload(files,source){
  pendingFiles=[...files];
  if(!pendingFiles.length) return;

  selectionNote.textContent=
    source==='camera'
      ? '1 new photo ready.'
      : `${pendingFiles.length} photo${pendingFiles.length===1?'':'s'} ready.`;

  uploadModal.classList.add('open');
  uploadModal.setAttribute('aria-hidden','false');
}

function closeUpload(){
  uploadModal.classList.remove('open');
  uploadModal.setAttribute('aria-hidden','true');
  pendingFiles=[];
  cameraInput.value='';
  galleryInput.value='';
  document.getElementById('caption').value='';
  selectionNote.textContent='No photo selected.';
}

document.getElementById('takePhotoBtn').addEventListener('click',()=>{
  cameraInput.click();
});

document.getElementById('choosePhotosBtn').addEventListener('click',()=>{
  galleryInput.click();
});

cameraInput.addEventListener('change',()=>{
  openUpload(cameraInput.files,'camera');
});

galleryInput.addEventListener('change',()=>{
  openUpload(galleryInput.files,'gallery');
});

document.getElementById('cancelBtn').addEventListener('click',closeUpload);

document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const filter=btn.dataset.filter;
    [...gallery.children].forEach(tile=>{
      tile.style.display=(filter==='all'||tile.dataset.category===filter)?'block':'none';
    });
  });
});

document.getElementById('addBtn').addEventListener('click',()=>{
  const event=document.getElementById('event').value;
  const eventLabel=document.getElementById('event').selectedOptions[0].textContent;
  const caption=document.getElementById('caption').value.trim();

  pendingFiles.forEach(file=>{
    if(!file.type.startsWith('image/')) return;

    const url=URL.createObjectURL(file);
    const tile=document.createElement('button');
    tile.type='button';
    tile.className='tile';
    tile.dataset.category=event;
    tile.dataset.url=url;
    tile.dataset.caption=caption || eventLabel;
    tile.innerHTML=`<img src="${url}" alt=""><span class="meta">${caption || eventLabel}</span>`;
    gallery.prepend(tile);
  });

  closeUpload();
});

gallery.addEventListener('click',event=>{
  const tile=event.target.closest('.tile');
  if(!tile || !tile.dataset.url) return;

  lightboxImg.src=tile.dataset.url;
  lightboxCaption.textContent=tile.dataset.caption || '';
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
});

function closeLightbox(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  lightboxImg.removeAttribute('src');
}

document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',event=>{
  if(event.target===lightbox) closeLightbox();
});
</script>
</body>
</html>
