<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b36">
<title>Spanish Golf Tour 2026 — Photos</title>

<style>
:root{
  --navy:#0d1b36;
  --navy2:#071522;
  --cream:#f4eddf;
  --teal:#1aa0a4;
  --orange:#f36b18;
  --line:rgba(13,27,54,.14);
  --muted:#6e7681;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy2);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}
body{min-height:100vh}
.app{max-width:680px;margin:0 auto;background:var(--cream);min-height:100vh}

.hero{
  background:linear-gradient(180deg,#112844 0%,#0d1b36 100%);
  color:white;
  border-bottom:3px solid var(--orange);
  padding:14px 16px 12px;
}
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:24px;line-height:1}
.hero small{display:block;margin-top:5px;color:#c8d2dc;font-weight:800}
.home{
  min-width:44px;min-height:44px;border:2px solid var(--teal);border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;
  font-size:20px;font-weight:900
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px;
  background:#fbf7ef;
  border-bottom:1px solid var(--line)
}
.actions button{
  min-height:50px;
  border-radius:10px;
  border:2px solid var(--teal);
  font-size:14px;
  font-weight:900
}
.actions button:disabled{opacity:.55}
.primary{background:var(--teal);color:white}
.secondary{background:transparent;color:var(--navy)}

.uploadStatus{
  display:none;
  padding:9px 12px;
  background:#eef3f3;
  border-bottom:1px solid var(--line);
  font-size:12px;
  font-weight:900;
}
.uploadStatus.show{display:block}
.uploadStatus.ok{color:#08715c}
.uploadStatus.error{color:#bb4319;background:#fff0e8}

.filters{
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--cream);
  border-bottom:1px solid var(--line);scrollbar-width:none
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid #bac3ca;background:#fffaf1;color:var(--navy);
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900
}
.chip.active{background:var(--navy);color:white;border-color:var(--navy)}

.gallery{
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#e9e2d7
}
.tile{
  position:relative;aspect-ratio:1/1;border:0;padding:0;overflow:hidden;background:#d2d8dc;
  cursor:pointer
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{
  position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;
  color:white;font-size:10px;font-weight:900;text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.72))
}
.tile.placeholder:nth-child(4n+1){background:linear-gradient(135deg,#6a8fad,#d8c29e)}
.tile.placeholder:nth-child(4n+2){background:linear-gradient(135deg,#407d70,#d6b268)}
.tile.placeholder:nth-child(4n+3){background:linear-gradient(135deg,#8b6d8f,#d8b9a4)}
.tile.placeholder:nth-child(4n+4){background:linear-gradient(135deg,#50698c,#9fc7c9)}
.placeholderIcon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:34px;opacity:.85
}

.noteBox{
  padding:12px 14px;background:#fffaf1;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;font-weight:800;line-height:1.35
}

.lightbox{
  position:fixed;inset:0;background:#02070c;display:none;z-index:30;
  align-items:center;justify-content:center;padding:18px
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}
.lightboxClose{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;
  width:46px;height:46px;border-radius:50%;border:2px solid white;background:rgba(0,0,0,.4);
  color:white;font-size:24px;font-weight:900
}
.lightboxCaption{
  position:absolute;left:14px;right:60px;bottom:calc(12px + env(safe-area-inset-bottom));
  color:white;font-weight:800;font-size:13px
}

.hiddenInput{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

@media(max-width:360px){
  .gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="heroRow">
      <div>
        <h1>Tour Photos</h1>
        <small>Spanish Golf Tour 2026</small>
      </div>
      <a class="home" href="index.html" aria-label="Main Menu">⌂</a>
    </div>
  </header>

  <section class="actions">
    <button id="takePhotoBtn" class="primary" type="button">📷 TAKE PHOTO</button>
    <button id="choosePhotosBtn" class="secondary" type="button">🖼️ CHOOSE PHOTOS</button>
  </section>

  <div id="uploadStatus" class="uploadStatus"></div>

  <nav class="filters" aria-label="Photo filters">
    <button class="chip active" data-filter="all" type="button">ALL</button>
    <button class="chip" data-filter="round1" type="button">ROUND 1</button>
    <button class="chip" data-filter="round2" type="button">ROUND 2</button>
    <button class="chip" data-filter="offcourse" type="button">OFF COURSE</button>
    <button class="chip" data-filter="travel" type="button">TRAVEL</button>
  </nav>

  <main id="gallery" class="gallery" aria-live="polite">
    <button class="tile placeholder" data-category="round1" type="button">
      <span class="placeholderIcon">⛳</span>
      <span class="meta">Round 1 · Las Brisas</span>
    </button>
    <button class="tile placeholder" data-category="offcourse" type="button">
      <span class="placeholderIcon">🍻</span>
      <span class="meta">Off Course · Marbella</span>
    </button>
    <button class="tile placeholder" data-category="round2" type="button">
      <span class="placeholderIcon">🏌️</span>
      <span class="meta">Round 2 · Golf</span>
    </button>
    <button class="tile placeholder" data-category="travel" type="button">
      <span class="placeholderIcon">✈️</span>
      <span class="meta">Travel · Arrival</span>
    </button>
    <button class="tile placeholder" data-category="round1" type="button">
      <span class="placeholderIcon">🏆</span>
      <span class="meta">Round 1 · Leaderboard moment</span>
    </button>
    <button class="tile placeholder" data-category="offcourse" type="button">
      <span class="placeholderIcon">🍽️</span>
      <span class="meta">Off Course · Dinner</span>
    </button>
  </main>

  <div class="noteBox">
    Drive upload test build. TAKE PHOTO uploads immediately after the camera returns. CHOOSE PHOTOS uploads each selected image to the shared Tour Photos folder.
  </div>
</div>

<input id="cameraInput" class="hiddenInput" type="file" accept="image/*" capture="environment">
<input id="galleryInput" class="hiddenInput" type="file" accept="image/*" multiple>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button id="lightboxClose" class="lightboxClose" type="button" aria-label="Close">×</button>
  <img id="lightboxImg" alt="">
  <div id="lightboxCaption" class="lightboxCaption"></div>
</div>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbz06cod2GzirOUT7HCyMLgzF9RLJE8psZQqEQFSzrKut3fYMGVsRicuEutsFabVNelm/exec";

const gallery =
  document.getElementById('gallery');

const cameraInput =
  document.getElementById('cameraInput');

const galleryInput =
  document.getElementById('galleryInput');

const takePhotoBtn =
  document.getElementById('takePhotoBtn');

const choosePhotosBtn =
  document.getElementById('choosePhotosBtn');

const statusEl =
  document.getElementById('uploadStatus');

const lightbox =
  document.getElementById('lightbox');

const lightboxImg =
  document.getElementById('lightboxImg');

const lightboxCaption =
  document.getElementById('lightboxCaption');


function setStatus(text,type=''){

  statusEl.textContent =
    text;

  statusEl.className =
    'uploadStatus show' +
    (type ? ' ' + type : '');
}


function clearStatus(){

  statusEl.textContent =
    '';

  statusEl.className =
    'uploadStatus';
}


function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        ()=>{

          const result =
            String(
              reader.result || ''
            );

          const comma =
            result.indexOf(',');

          resolve(
            comma >= 0
              ? result.slice(comma + 1)
              : result
          );
        };

      reader.onerror =
        ()=>reject(
          new Error(
            'Unable to read photo.'
          )
        );

      reader.readAsDataURL(
        file
      );
    }
  );
}


/**
 * Cross-origin POST deliberately uses no-cors.
 *
 * The browser is allowed to send a normal HTML-style POST to Apps Script,
 * but it cannot inspect the cross-origin response. The successful completion
 * of fetch tells us the POST completed; Drive is the permanent store.
 */
async function uploadPhoto(file){

  const base64 =
    await fileToBase64(
      file
    );


  const body =
    new URLSearchParams();

  body.set(
    'service',
    'photos'
  );

  body.set(
    'action',
    'upload'
  );

  body.set(
    'fileName',
    file.name ||
    (
      'SGT26-' +
      Date.now() +
      '.jpg'
    )
  );

  body.set(
    'mimeType',
    file.type ||
    'image/jpeg'
  );

  body.set(
    'base64',
    base64
  );


  await fetch(
    API_URL,
    {
      method:
        'POST',

      mode:
        'no-cors',

      body:
        body
    }
  );
}


function addLocalPreview(
  file,
  label
){

  const url =
    URL.createObjectURL(
      file
    );


  const tile =
    document.createElement(
      'button'
    );

  tile.type =
    'button';

  tile.className =
    'tile';

  tile.dataset.category =
    'round1';

  tile.dataset.url =
    url;

  tile.dataset.caption =
    label;


  tile.innerHTML =
    `<img src="${url}" alt=""><span class="meta">${label}</span>`;


  gallery.prepend(
    tile
  );
}


async function uploadFiles(
  files,
  sourceLabel
){

  const selected =
    [...files]
      .filter(
        file =>
          String(
            file.type || ''
          )
            .startsWith(
              'image/'
            )
      );


  if (!selected.length) {
    return;
  }


  takePhotoBtn.disabled =
    true;

  choosePhotosBtn.disabled =
    true;


  try {

    for (
      let index = 0;
      index < selected.length;
      index++
    ) {

      const file =
        selected[index];


      setStatus(
        selected.length === 1
          ? 'Uploading photo to Drive…'
          : (
              'Uploading ' +
              (index + 1) +
              ' of ' +
              selected.length +
              ' photos…'
            )
      );


      await uploadPhoto(
        file
      );


      addLocalPreview(
        file,
        sourceLabel
      );
    }


    setStatus(
      selected.length === 1
        ? '✓ Photo uploaded to Tour Drive.'
        : (
            '✓ ' +
            selected.length +
            ' photos uploaded to Tour Drive.'
          ),
      'ok'
    );

  } catch (error) {

    setStatus(
      'Upload failed: ' +
      (
        error.message ||
        error
      ),
      'error'
    );

  } finally {

    takePhotoBtn.disabled =
      false;

    choosePhotosBtn.disabled =
      false;

    cameraInput.value =
      '';

    galleryInput.value =
      '';
  }
}


takePhotoBtn.addEventListener(
  'click',
  ()=>{

    clearStatus();

    cameraInput.click();
  }
);


choosePhotosBtn.addEventListener(
  'click',
  ()=>{

    clearStatus();

    galleryInput.click();
  }
);


cameraInput.addEventListener(
  'change',
  ()=>{

    uploadFiles(
      cameraInput.files,
      'Camera · just now'
    );
  }
);


galleryInput.addEventListener(
  'change',
  ()=>{

    uploadFiles(
      galleryInput.files,
      'Gallery upload'
    );
  }
);


document.querySelectorAll(
  '.chip'
)
  .forEach(
    btn=>{

      btn.addEventListener(
        'click',
        ()=>{

          document.querySelectorAll(
            '.chip'
          )
            .forEach(
              b =>
                b.classList.remove(
                  'active'
                )
            );


          btn.classList.add(
            'active'
          );


          const filter =
            btn.dataset.filter;


          [...gallery.children]
            .forEach(
              tile=>{

                tile.style.display =
                  (
                    filter === 'all' ||
                    tile.dataset.category === filter
                  )
                    ? 'block'
                    : 'none';
              }
            );
        }
      );
    }
  );


gallery.addEventListener(
  'click',
  event=>{

    const tile =
      event.target.closest(
        '.tile'
      );


    if (
      !tile ||
      !tile.dataset.url
    ) {
      return;
    }


    lightboxImg.src =
      tile.dataset.url;


    lightboxCaption.textContent =
      tile.dataset.caption || '';


    lightbox.classList.add(
      'open'
    );


    lightbox.setAttribute(
      'aria-hidden',
      'false'
    );
  }
);


function closeLightbox(){

  lightbox.classList.remove(
    'open'
  );


  lightbox.setAttribute(
    'aria-hidden',
    'true'
  );


  lightboxImg.removeAttribute(
    'src'
  );
}


document.getElementById(
  'lightboxClose'
)
  .addEventListener(
    'click',
    closeLightbox
  );


lightbox.addEventListener(
  'click',
  event=>{

    if (
      event.target === lightbox
    ) {
      closeLightbox();
    }
  }
);
</script>
</body>
</html>
