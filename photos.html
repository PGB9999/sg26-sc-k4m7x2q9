<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b36">
<title>Spanish Golf Tour 2026 — Photos Prototype</title>
<style>
:root{--navy:#0d1b36;--navy2:#071522;--cream:#f4eddf;--teal:#1aa0a4;--orange:#f36b18;--line:rgba(13,27,54,.14);--muted:#6e7681}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy2);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}
.app{max-width:680px;margin:0 auto;background:var(--cream);min-height:100vh}
.hero{background:linear-gradient(180deg,#112844,#0d1b36);color:#fff;border-bottom:3px solid var(--orange);padding:14px 16px 12px}
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{margin:0;font-size:24px}.hero small{display:block;margin-top:5px;color:#c8d2dc;font-weight:800}
.home{min-width:44px;min-height:44px;border:2px solid var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:20px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#fbf7ef;border-bottom:1px solid var(--line)}
.actions button{min-height:48px;border-radius:10px;border:2px solid var(--teal);font-size:15px;font-weight:900}.primary{background:var(--teal);color:#fff}.secondary{background:transparent;color:var(--navy)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #bac3ca;background:#fffaf1;color:var(--navy);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.chip.active{background:var(--navy);color:#fff}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#e9e2d7}
.tile{position:relative;aspect-ratio:1/1;border:0;padding:0;overflow:hidden;background:#d2d8dc}.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;color:#fff;font-size:10px;font-weight:900;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.tile:nth-child(4n+1){background:linear-gradient(135deg,#6a8fad,#d8c29e)}.tile:nth-child(4n+2){background:linear-gradient(135deg,#407d70,#d6b268)}.tile:nth-child(4n+3){background:linear-gradient(135deg,#8b6d8f,#d8b9a4)}.tile:nth-child(4n+4){background:linear-gradient(135deg,#50698c,#9fc7c9)}
.placeholderIcon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.85}
.noteBox{padding:12px 14px;background:#fffaf1;border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;line-height:1.35}
.modal{position:fixed;inset:0;background:rgba(2,9,16,.82);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}
.sheet{width:min(100%,680px);background:var(--cream);border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:20px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}
.field select,.field input{width:100%;min-height:46px;border:2px solid #c8d0d6;border-radius:9px;background:#fff;padding:8px 10px;font-size:16px}
.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheetBtns button{min-height:48px;border-radius:10px;font-weight:900;font-size:15px}
.cancel{background:transparent;border:2px solid var(--teal);color:var(--navy)}.add{background:var(--teal);border:2px solid var(--teal);color:#fff}
.lightbox{position:fixed;inset:0;background:#02070c;display:none;z-index:30;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}.close{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;font-size:24px}
.caption{position:absolute;left:14px;right:60px;bottom:14px;color:#fff;font-weight:800;font-size:13px}
@media(max-width:360px){.gallery{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="heroRow"><div><h1>Tour Photos</h1><small>Spanish Golf Tour 2026</small></div><a class="home" href="index.html" aria-label="Main Menu">⌂</a></div></header>
<section class="actions"><button id="addPhotosBtn" class="primary" type="button">📷 ADD PHOTOS</button><button id="galleryBtn" class="secondary" type="button">▦ GALLERY</button></section>
<nav class="filters">
<button class="chip active" data-filter="all">ALL</button><button class="chip" data-filter="round1">ROUND 1</button><button class="chip" data-filter="round2">ROUND 2</button><button class="chip" data-filter="offcourse">OFF COURSE</button><button class="chip" data-filter="travel">TRAVEL</button>
</nav>
<main id="gallery" class="gallery">
<button class="tile" data-category="round1"><span class="placeholderIcon">⛳</span><span class="meta">Round 1 · Las Brisas</span></button>
<button class="tile" data-category="offcourse"><span class="placeholderIcon">🍻</span><span class="meta">Off Course · Marbella</span></button>
<button class="tile" data-category="round2"><span class="placeholderIcon">🏌️</span><span class="meta">Round 2 · Golf</span></button>
<button class="tile" data-category="travel"><span class="placeholderIcon">✈️</span><span class="meta">Travel · Arrival</span></button>
<button class="tile" data-category="round1"><span class="placeholderIcon">🏆</span><span class="meta">Round 1 · Leaderboard moment</span></button>
<button class="tile" data-category="offcourse"><span class="placeholderIcon">🍽️</span><span class="meta">Off Course · Dinner</span></button>
</main>
<div class="noteBox">Prototype only: selected photos stay on this device. Next phase will connect uploads to Google Drive and catalogue them centrally.</div>
</div>

<div id="uploadModal" class="modal"><section class="sheet">
<h2>Add Tour Photos</h2>
<div class="field"><label>EVENT / ROUND</label><select id="event"><option value="round1">Round 1 · Las Brisas</option><option value="round2">Round 2</option><option value="offcourse">Off Course</option><option value="travel">Travel</option></select></div>
<div class="field"><label>CAPTION · OPTIONAL</label><input id="caption" type="text" maxlength="80" placeholder="e.g. PGB escapes the bunker"></div>
<div class="field"><label>PHOTOS</label><input id="files" type="file" accept="image/*" multiple></div>
<div class="sheetBtns"><button id="cancelBtn" class="cancel" type="button">CANCEL</button><button id="addBtn" class="add" type="button">ADD TO GALLERY</button></div>
<p class="noteBox">Prototype: images are previewed locally and disappear when the page is closed.</p>
</section></div>

<div id="lightbox" class="lightbox"><button id="closeBtn" class="close" type="button">×</button><img id="lightboxImg" alt=""><div id="lightboxCaption" class="caption"></div></div>

<script>
const gallery=document.getElementById('gallery'), modal=document.getElementById('uploadModal'), lightbox=document.getElementById('lightbox');
document.getElementById('addPhotosBtn').onclick=()=>modal.classList.add('open');
document.getElementById('cancelBtn').onclick=()=>modal.classList.remove('open');
document.querySelectorAll('.chip').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const f=btn.dataset.filter;[...gallery.children].forEach(t=>t.style.display=(f==='all'||t.dataset.category===f)?'block':'none')});
document.getElementById('addBtn').onclick=()=>{const files=[...document.getElementById('files').files],cat=document.getElementById('event').value,label=document.getElementById('event').selectedOptions[0].textContent,cap=document.getElementById('caption').value.trim();files.forEach(file=>{if(!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),tile=document.createElement('button');tile.className='tile';tile.dataset.category=cat;tile.dataset.url=url;tile.dataset.caption=cap||label;tile.innerHTML=`<img src="${url}" alt=""><span class="meta">${cap||label}</span>`;gallery.prepend(tile)});modal.classList.remove('open')};
gallery.onclick=e=>{const t=e.target.closest('.tile');if(!t||!t.dataset.url)return;document.getElementById('lightboxImg').src=t.dataset.url;document.getElementById('lightboxCaption').textContent=t.dataset.caption||'';lightbox.classList.add('open')};
document.getElementById('closeBtn').onclick=()=>lightbox.classList.remove('open');
</script>
</body>
</html>
