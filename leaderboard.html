<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b36">
  <title>Spanish Golf Tour 2026 — Leaderboard</title>
  <style>
    :root{
      --navy:#0d1b36;
      --navy2:#071522;
      --cream:#f4eddf;
      --teal:#1aa0a4;
      --orange:#f36b18;
      --line:rgba(13,27,54,.16);
      --muted:#6d7480;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--navy2);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}
    body{min-height:100vh}
    .app{max-width:860px;margin:0 auto;background:var(--cream);min-height:100vh}
    .hero{
      background:linear-gradient(180deg,#112844 0%,#0d1b36 100%);
      color:white;
      border-bottom:3px solid var(--orange);
    }
    .titleRow{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(108px,.85fr)}
    .titleBox,.timeBox{padding:14px 18px}
    .timeBox{border-left:1px solid rgba(255,255,255,.18)}
    .eyebrow{display:block;font-size:13px;letter-spacing:.8px;font-weight:900;color:#b9c6d4;margin-bottom:6px}
    .roundSelectWrap{position:relative}
    .roundSelect{
      width:100%;
      appearance:none;
      -webkit-appearance:none;
      border:0;
      background:transparent;
      color:white;
      font-size:clamp(20px,5vw,31px);
      line-height:1.06;
      font-weight:900;
      padding:0 28px 0 0;
      outline:none;
    }
    .roundSelectWrap:after{
      content:"⌄";
      position:absolute;
      right:0;
      top:3px;
      color:white;
      font-weight:900;
      pointer-events:none;
    }
    .timeBox strong{font-size:21px}
    .golfToggle{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:var(--navy2);
      border-bottom:3px solid var(--orange);
    }
    .golfToggle a,
    .golfToggle span{
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:.35px;
      font-size:14px;
      text-decoration:none;
    }
    .golfToggle a{color:var(--cream);background:var(--navy2)}
    .golfToggle span{color:var(--navy);background:var(--cream)}
    .board{padding:0}
    .head,.row{
      display:grid;
      grid-template-columns:58px minmax(88px,1.35fr) 72px 78px 88px;
      align-items:center;
      min-width:0;
    }
    .head{
      min-height:48px;
      background:#fbf7ef;
      border-bottom:1px solid var(--line);
      font-size:12px;
      font-weight:900;
      letter-spacing:.25px;
      text-align:center;
    }
    .row{
      min-height:86px;
      border-bottom:1px solid var(--line);
      background:var(--cream);
      text-align:center;
    }
    .pos{font-size:28px;font-weight:900}
    .player{font-size:25px;font-weight:900;text-align:left;padding-left:8px}
    .thru{font-size:22px;font-weight:900}
    .pts{font-size:34px;font-weight:1000}
    .last{
      width:46px;height:46px;border:2px solid var(--teal);border-radius:50%;
      display:flex;align-items:center;justify-content:center;margin:auto;
      font-size:22px;font-weight:900;background:#fbf7ef
    }
    .row[data-player="PGB"] .player,.row[data-player="PGB"] .pts{color:#0d1b36}
    .row[data-player="DCM"] .player,.row[data-player="DCM"] .pts{color:#f36b18}
    .row[data-player="STU"] .player,.row[data-player="STU"] .pts{color:#c49a00}
    .row[data-player="GEN"] .player,.row[data-player="GEN"] .pts{color:#7b3fb1}
    .status{
      background:#000;color:white;display:flex;justify-content:space-between;align-items:center;
      gap:12px;padding:10px 14px;font-size:12px;font-weight:900;letter-spacing:.2px
    }
    .status strong{color:#2bc3c8}
    .status .countdown{white-space:nowrap}
    .footer{
      background:var(--navy2);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:12px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
    }
    .footer a,.footer button{
      min-height:54px;border-radius:12px;border:2px solid var(--teal);
      background:transparent;color:white;font-size:16px;font-weight:900;
      display:flex;align-items:center;justify-content:center;text-decoration:none
    }
    .footer button{cursor:pointer}
    .footer button:active,.footer a:active{transform:translateY(1px)}
    .empty{padding:38px 20px;text-align:center;color:var(--muted);font-weight:800}
    .error{color:var(--orange)!important}
    @media(max-width:420px){
      .head,.row{grid-template-columns:44px minmax(72px,1.25fr) 58px 68px 70px}
      .player{font-size:22px}
      .pts{font-size:30px}
      .last{width:40px;height:40px;font-size:20px}
      .titleBox,.timeBox{padding:12px 14px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="titleRow">
      <div class="titleBox">
        <span id="roundLabel" class="eyebrow">ROUND 1</span>
        <div class="roundSelectWrap">
          <select id="roundSelect" class="roundSelect" aria-label="Choose round">
            <option value="1">LAS BRISAS · 59 TEE</option>
            <option value="2">LOS ARQUEROS · YELLOW TEE</option>
            <option value="3">ATALAYA GOLF - NEW COURSE · YELLOW TEE</option>
            <option value="4">SANTA CLARA GOLF · YELLOW TEE</option>
            <option value="5">MARBELLA GOLF RESORT · EQUIVALENT TEE</option>
            <option value="6">SANTANA · YELLOW TEE</option>
          </select>
        </div>
      </div>
      <div class="timeBox">
        <span class="eyebrow">TEE TIME</span>
        <strong id="teeTime">—</strong>
      </div>
    </div>
  </header>

  <nav class="golfToggle" aria-label="Golf view">
    <a id="scorecardLink" href="scorecard.html">SCORECARD</a>
    <span aria-current="page">LEADERBOARD</span>
  </nav>

  <main class="board">
    <div class="head">
      <div>POS</div>
      <div style="text-align:left;padding-left:8px">PLAYER</div>
      <div>THRU</div>
      <div>PTS</div>
      <div>LAST</div>
    </div>
    <div id="rows">
      <div class="empty">Loading leaderboard…</div>
    </div>
  </main>

  <div class="status">
    <strong id="updated">LOADING…</strong>
    <span id="freshness">NO CACHED DATA</span>
  </div>

  <footer class="footer">
    <a href="index.html">🏠 MENU</a>
    <button id="refreshBtn" type="button">↻ REFRESH</button>
  </footer>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbz06cod2GzirOUT7HCyMLgzF9RLJE8psZQqEQFSzrKut3fYMGVsRicuEutsFabVNelm/exec";
let currentRound=1;
function queryRound(){
  const q=new URLSearchParams(location.search);
  const n=Number(q.get('round')||1);
  return Number.isInteger(n)&&n>=1&&n<=6?n:1;
}


function cacheKey(roundNumber){
  return `sgt26_leaderboard_round_${roundNumber}`;
}

function loadCachedLeaderboard(roundNumber){
  try{
    const raw=localStorage.getItem(cacheKey(roundNumber));
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.data)) return null;
    return parsed;
  }catch(error){
    console.warn('Leaderboard cache read failed:',error);
    return null;
  }
}

function saveCachedLeaderboard(roundNumber,data){
  try{
    localStorage.setItem(
      cacheKey(roundNumber),
      JSON.stringify({
        savedAt:new Date().toISOString(),
        data:data
      })
    );
  }catch(error){
    console.warn('Leaderboard cache write failed:',error);
  }
}

function formatFreshness(iso){
  if(!iso) return 'NO CACHED DATA';
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return 'LAST KNOWN DATA';
  const now=Date.now();
  const secs=Math.max(0,Math.floor((now-d.getTime())/1000));
  if(secs<5) return 'UPDATED JUST NOW';
  if(secs<60) return `UPDATED ${secs}s AGO`;
  const mins=Math.floor(secs/60);
  return `UPDATED ${mins}m AGO`;
}

function showCachedLeaderboard(){
  const cached=loadCachedLeaderboard(currentRound);
  if(!cached) return false;

  renderRows(cached.data);
  document.getElementById('updated').textContent='LAST KNOWN';
  document.getElementById('updated').classList.remove('error');
  document.getElementById('freshness').textContent=formatFreshness(cached.savedAt);
  return true;
}

function apiJsonp(params){
  return new Promise((resolve,reject)=>{
    const callbackName=`sgt26Lb_${Date.now()}_${Math.floor(Math.random()*100000)}`;
    const script=document.createElement('script');
    const cleanup=()=>{try{delete window[callbackName]}catch(_){} script.remove()};
    const timeout=setTimeout(()=>{cleanup();reject(new Error('Leaderboard request timed out.'))},15000);

    window[callbackName]=payload=>{
      clearTimeout(timeout);cleanup();
      if(!payload||payload.ok===false){
        reject(new Error(payload?.error||'Leaderboard request failed.'));
        return;
      }
      resolve(payload.data);
    };

    script.onerror=()=>{
      clearTimeout(timeout);cleanup();reject(new Error('Unable to contact leaderboard backend.'));
    };

    const query=new URLSearchParams({...params,callback:callbackName,v:'RyderCup2022.1'});
    script.src=`${API_URL}?${query.toString()}`;
    document.head.appendChild(script);
  });
}

function renderRows(items){
  const host=document.getElementById('rows');
  if(!Array.isArray(items)||!items.length){
    host.innerHTML='<div class="empty">No leaderboard data yet.</div>';
    return;
  }
  host.innerHTML=items.map(item=>`
    <div class="row" data-player="${item.player}">
      <div class="pos">${item.position}</div>
      <div class="player">${item.player}</div>
      <div class="thru">${item.thru||'—'}</div>
      <div class="pts">${item.totalPoints}</div>
      <div class="last">${item.lastHolePoints===null?'—':item.lastHolePoints}</div>
    </div>
  `).join('');
}

function updateLinks(){
  document.getElementById('scorecardLink').href=`scorecard.html?round=${currentRound}`;
}

function updateMeta(roundData){
  if(!roundData||!roundData.round)return;
  document.getElementById('roundLabel').textContent=`ROUND ${roundData.round}`;
  document.getElementById('teeTime').textContent=String(roundData.teeTime||'TBD').toUpperCase();
}

async function loadLeaderboard(){
  const host=document.getElementById('rows');
  const hadCache=showCachedLeaderboard();

  if(!hadCache){
    host.innerHTML='<div class="empty">Loading leaderboard…</div>';
  }

  document.getElementById('updated').textContent='UPDATING…';
  document.getElementById('updated').classList.remove('error');

  try{
    const [leaderboard,roundPayload]=await Promise.all([
      apiJsonp({service:'scorecards',action:'leaderboard',round:currentRound}),
      apiJsonp({service:'scorecards',action:'round',round:currentRound})
    ]);

    renderRows(leaderboard);
    updateMeta(roundPayload.round);
    saveCachedLeaderboard(currentRound,leaderboard);

    document.getElementById('updated').textContent='✓ UPDATED';
    document.getElementById('freshness').textContent='JUST NOW';
  }catch(error){
    console.error(error);

    if(hadCache){
      document.getElementById('updated').textContent='⚠ LAST KNOWN';
      document.getElementById('freshness').textContent='NETWORK UNAVAILABLE';
    }else{
      document.getElementById('updated').textContent='⚠ DATA ERROR';
      document.getElementById('updated').classList.add('error');
      document.getElementById('freshness').textContent='NO CACHED DATA';
    }
  }
}

document.getElementById('roundSelect').addEventListener('change',e=>{
  currentRound=Number(e.target.value)||1;
  history.replaceState(null,'',`leaderboard.html?round=${currentRound}`);
  updateLinks();
  loadLeaderboard();
});

document.getElementById('refreshBtn').addEventListener('click',loadLeaderboard);

currentRound=queryRound();
document.getElementById('roundSelect').value=String(currentRound);
updateLinks();
loadLeaderboard();
</script>
<!-- RyderCup2022.2: cached leaderboard + refresh-on-entry -->
</body>
</html>
