<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1d36">
<title>SGT26 Scorecard</title>
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --navy:#071728;
  --navy2:#0b2036;
  --orange:#f36b18;
  --teal:#0b989d;
  --cream:#f6f0e2;
  --ink:#111b2d;
  --line:#ddd3c0;
  --purple:#7346a0;
  --yellow:#b99100;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#06101d;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.app{
  width:100%;
  max-width:none;
  min-height:100vh;
  background:var(--cream);
  overflow-x:hidden;
}
.banner{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio: 4.35 / 1;
  object-fit:cover;
  background:#111;
}
.roundbar{
  background:linear-gradient(90deg,var(--navy),var(--navy2));
  color:#fff;
  display:grid;
  grid-template-columns:1.15fr 1.35fr .9fr;
  gap:0;
  padding:0 10px;
  border-bottom:2px solid var(--orange);
}
.roundbar>div{
  padding:5px 7px 5px;
  font-size:13px;
  font-weight:900;
  line-height:1.15;
}
.roundbar>div+div{border-left:1px solid #ffffff44}
.roundbar span{
  opacity:.72;
  display:block;
  font-size:9px;
  letter-spacing:.08em;
  margin-bottom:4px;
}
.hole{
  padding:0;
  background:linear-gradient(90deg,#0b8f94 0 23%,#f8f1e2 23% 100%);
  border-bottom:0;
}
.holegrid{
  display:grid;
  grid-template-columns:23% 1fr 1fr 1.2fr;
  min-height:88px;
  align-items:stretch;
}
.big7{
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:54px;
  line-height:1;
  font-weight:1000;
  font-family:Impact,Arial Black,sans-serif;
  text-shadow:0 2px 0 #0003;
}
.big7::before{
  content:"HOLE";
  position:absolute;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:.05em;
  transform:translateY(-31px);
}
.metric{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-left:1px solid #0002;
  text-align:center;
}
.metric b{
  display:block;
  font-family:Impact,Arial Black,sans-serif;
  font-size:35px;
  line-height:.9;
}
.metric small{
  font-weight:900;
  font-size:11px;
  letter-spacing:.08em;
  margin-bottom:3px;
}
.metric.si b{color:var(--orange)}
.metric.yds{
  border-left:1px solid #0002;
  margin:5px 6px 5px 0;
  background:#dfe7d7;
}
.stable{
  background:#050505;
  color:white;
  text-align:center;
  padding:5px 8px;
  font-weight:900;
  letter-spacing:.03em;
  font-size:15px;
}
.stable em{color:#1db3b8;font-style:normal}
.note{
  padding:8px 12px;
  font-size:11px;
  line-height:1.25;
  background:#fff3c7;
  color:#5c4700;
  text-align:center;
  border-bottom:1px solid #e5d7a9;
}
.head,.player{
  display:grid;
  grid-template-columns:18% 34% 16% 14% 18%;
  align-items:center;
}
.head{
  min-height:30px;
  padding:0 8px;
  font-size:9px;
  font-weight:900;
  text-align:center;
  border-bottom:1px solid #0002;
}
.head div:first-child{text-align:left}
.player{
  min-height:62px;
  padding:3px 7px;
  border-bottom:1px solid #0002;
}
.name{
  font-family:Impact,Arial Black,sans-serif;
  font-size:28px;
  font-style:italic;
  letter-spacing:.02em;
}
.controls{
  display:grid;
  grid-template-columns:44px minmax(52px,1fr) 44px;
  gap:5px;
}
button{font:inherit}
.minus,.plus{
  border:0;
  border-radius:7px;
  background:var(--teal);
  color:white;
  font-size:28px;
  font-weight:900;
  min-height:48px;
  box-shadow:0 2px 0 #0003;
}
.score{
  display:grid;
  place-items:center;
  background:#fffaf1;
  border:1.5px solid #253447;
  border-radius:7px;
  font-size:30px;
  font-weight:1000;
  min-height:48px;
}
.shots,.pts,.total{
  text-align:center;
  font-weight:1000;
  font-size:10px;
  line-height:1.05;
}
.shots b,.pts b,.total b{
  display:block;
  font-size:27px;
  line-height:1;
  margin-bottom:3px;
}
.total{
  background:#0a0a0a;
  color:white;
  border-radius:7px;
  padding:5px 2px;
}
.player[data-p="DCM"] .name,.player[data-p="DCM"] .shots b,.player[data-p="DCM"] .pts b,.player[data-p="DCM"] .total b{color:var(--orange)}
.player[data-p="STU"] .name,.player[data-p="STU"] .shots b,.player[data-p="STU"] .pts b,.player[data-p="STU"] .total b{color:var(--yellow)}
.player[data-p="GEN"] .name,.player[data-p="GEN"] .shots b,.player[data-p="GEN"] .pts b,.player[data-p="GEN"] .total b{color:var(--purple)}
.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  min-height:30px;
  padding:5px 8px;
  background:#050505;
  color:white;
  font-weight:800;
  font-size:10px;
}
.status strong{color:#1db3b8}
.nav{
  display:grid;
  grid-template-columns:1fr 1.45fr 1fr;
  gap:8px;
  padding:5px 8px calc(5px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#06101d,#081625);
  position:sticky;
  bottom:0;
  z-index:5;
}
.nav button{
  min-height:52px;
  border:1.5px solid var(--teal);
  background:#0a1726;
  color:white;
  border-radius:9px;
  padding:8px 4px;
  font-weight:1000;
  font-size:13px;
}
.nav .next{
  background:linear-gradient(90deg,#0a8f95,#0aa1a5);
  font-family:Impact,Arial Black,sans-serif;
  font-size:23px;
  letter-spacing:.02em;
}
@media (min-width:700px){
  .app{max-width:430px;margin:0 auto;box-shadow:0 0 24px #0008}
}
@media (max-width:390px){
  .roundbar>div{font-size:11px;padding-left:6px;padding-right:6px}
  .holegrid{min-height:86px}
  .big7{font-size:52px}
  .metric b{font-size:33px}
  .name{font-size:25px}
  .controls{grid-template-columns:40px minmax(48px,1fr) 40px}
  .minus,.plus,.score{min-height:46px}
  .shots b,.pts b,.total b{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <img class="banner" src="sgt26-banner.png" alt="Spanish Golf Tour 2026">
  <div class="roundbar">
    <div><span>ROUND 1</span>LAS BRISAS · 59 TEE</div>
    <div><span>DATE</span>SAT 29 AUG 2026</div>
    <div><span>TEE TIME</span>TBD</div>
  </div>

  <section class="hole">
    <div class="holegrid">
      <div class="big7" id="holeNo">1</div>
      <div class="metric"><small>PAR</small><b id="par">4</b></div>
      <div class="metric si"><small>SI</small><b id="si">11</b></div>
      <div class="metric yds"><b id="yards">—</b><small>YDS</small></div>
    </div>
  </section>

  <div class="stable"><em>STABLEFORD</em> · 0 POINTS = PICK UP</div>
<div class="head"><div>PLAYER</div><div>GROSS SCORE</div><div>SHOTS</div><div>PTS</div><div>TOTAL</div></div>
  <div id="players"></div>

  <div class="status"><div>✓ <strong>AUTO SAVED</strong> · ON THIS PHONE</div><div id="best">BEST: —</div></div>
  <div class="nav">
    <button onclick="move(-1)">‹ PREV<br>HOLE</button>
    <button class="next" onclick="move(1)">NEXT HOLE ›</button>
    <button onclick="resetRound()">RESET<br>TEST</button>
  </div>
</div>

<script>
const players=[
 {id:'PGB',ch:29},{id:'DCM',ch:16},{id:'STU',ch:25},{id:'GEN',ch:27}
];
// Par/SI data already established for Las Brisas. Metres intentionally null in Prototype 1.
const holes=[
[4,11,null],[4,1,null],[4,7,null],[3,13,null],[5,9,null],[4,3,null],[3,17,null],[5,5,null],[4,15,null],
[4,6,null],[3,14,null],[5,12,null],[4,8,null],[4,2,null],[5,16,null],[3,18,null],[4,4,null],[4,10,null]
];
let hole=+(localStorage.sgt26Hole||1);
let scores=JSON.parse(localStorage.sgt26Scores||'{}');

function shotsOnHole(ch,si){
  return Math.floor(ch/18)+(si <= (ch%18) ? 1 : 0);
}
function stableford(gross,par,shots){
  if(!gross) return null;
  return Math.max(0, 2 + par + shots - gross);
}
function totalFor(pid){
  let t=0;
  for(let h=1;h<=18;h++){
    const gross=scores[pid]?.[h];
    if(gross){
      const [par,si]=holes[h-1];
      const p=players.find(x=>x.id===pid);
      t+=stableford(gross,par,shotsOnHole(p.ch,si));
    }
  }
  return t;
}
function save(){
  localStorage.sgt26Scores=JSON.stringify(scores);
  localStorage.sgt26Hole=hole;
}
function render(){
  const [par,si,m]=holes[hole-1];
  document.getElementById('holeNo').textContent=hole;
  document.getElementById('par').textContent=par;
  document.getElementById('si').textContent=si;
  document.getElementById('yards').textContent=m?Math.round(m*1.09361):'—';
  const wrap=document.getElementById('players'); wrap.innerHTML='';
  let bestPts=-1,best=[];
  players.forEach(p=>{
    const gross=scores[p.id]?.[hole]||0;
    const sh=shotsOnHole(p.ch,si);
    const pts=stableford(gross,par,sh);
    if(pts!==null){if(pts>bestPts){bestPts=pts;best=[p.id]}else if(pts===bestPts)best.push(p.id)}
    const row=document.createElement('div'); row.className='player'; row.dataset.p=p.id;
    row.innerHTML=`<div class="name">${p.id}</div>
      <div class="controls"><button class="minus" onclick="bump('${p.id}',-1)">−</button>
      <div class="score">${gross||'–'}</div><button class="plus" onclick="bump('${p.id}',1)">+</button></div>
      <div class="shots"><b>${sh}</b>${sh===1?'SHOT':'SHOTS'}</div>
      <div class="pts"><b>${pts===null?'–':pts}</b>PTS</div>
      <div class="total"><b>${totalFor(p.id)}</b>PTS</div>`;
    wrap.appendChild(row);
  });
  document.getElementById('best').textContent=bestPts>=0?`BEST: ${best.join(' / ')} · ${bestPts} PTS`:'BEST: —';
}
function bump(pid,d){
  scores[pid]??={};
  let n=scores[pid][hole]||0;
  n=Math.max(0,Math.min(15,n+d));
  if(n===0) delete scores[pid][hole]; else scores[pid][hole]=n;
  save();render();
}
function move(d){hole=Math.max(1,Math.min(18,hole+d));save();render();window.scrollTo({top:0,behavior:'smooth'})}
function resetRound(){if(confirm('Clear all prototype scores on this phone?')){scores={};hole=1;save();render()}}
render();
</script>
</body>
</html>
