<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Spanish Golf Tour 2026</title>
  <!-- SGT26 HUB BUILD: V1.3 CROPPED ARTWORK -->

  <style>
    :root {
      --hub-bg:#061a2b;
      --focus:#ffffff;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      width:100%;
      height:100%;
      background:var(--hub-bg);
    }

    body {
      display:grid;
      place-items:start center;
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
    }

    /*
      Fit the complete artwork inside BOTH the available width and height.
      The crop reduces the aspect ratio enough that the S24 should use
      substantially more of the screen width than the previous version.
    */
    .hub-shell {
      position:relative;
      width:min(100vw, calc(100dvh * 850 / 1731));
      max-width:850px;
      aspect-ratio:850 / 1731;
      margin:0 auto;
      background:var(--hub-bg);
    }

    @supports not (height:100dvh) {
      .hub-shell {
        width:min(100vw, calc(100vh * 850 / 1731));
      }
    }

    .hub-art {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }

    /*
      Invisible real HTML hit areas.
      Percentages are relative to the cropped 850 x 1731 artwork.
    */
    .hub-link {
      position:absolute;
      top:62.40%;
      height:26.30%;
      border:0;
      border-radius:2.2%;
      background:transparent;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }

    .hub-link:focus-visible {
      outline:4px solid var(--focus);
      outline-offset:-6px;
    }

    .hub-link:active::after {
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:rgba(255,255,255,.10);
    }

    .hub-golf {
      left:2.2%;
      width:30.2%;
    }

    .hub-expenses {
      left:33.7%;
      width:31.8%;
    }

    .hub-photos {
      left:66.6%;
      width:31.1%;
      cursor:default;
    }

    .hub-photos:active::after {
      display:none;
    }
  </style>
</head>

<body>
  <main class="hub-shell" aria-label="Spanish Golf Tour 2026 main menu">
    <img
      class="hub-art"
      src="hub-main-menu.png"
      alt="Spanish Golf Tour 2026 with Golf, Expenses and Photos menu options"
      width="850"
      height="1731">

    <a
      class="hub-link hub-golf"
      href="index.html"
      aria-label="Open Golf — Scorecard and Leaderboard">
    </a>

    <a
      class="hub-link hub-expenses"
      href="expenses.html"
      aria-label="Open Expenses">
    </a>

    <span
      class="hub-link hub-photos"
      role="button"
      aria-disabled="true"
      aria-label="Photos — coming later">
    </span>
  </main>
</body>
</html>
