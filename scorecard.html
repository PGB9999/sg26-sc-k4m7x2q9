<!doctype html>
<!-- SGT26_BUILD:OpenBoardScorecard1.6 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1d36">
<title>SGT26 Scorecard</title>
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{
  --vh: 100dvh;
  --banner-h: clamp(92px, 17dvh, 142px);
  --round-h: clamp(58px, 7.2dvh, 74px);
  --hole-h: clamp(128px, 16dvh, 164px);
  --player-h: clamp(74px, 9.6dvh, 94px);
  --nav-h: clamp(74px, 10dvh, 94px);
  --navy:#071728;
  --navy2:#0b2036;
  --orange:#f36b18;
  --teal:#0b989d;
  --cream:#f6f0e2;
  --ink:#111b2d;
  --line:#ddd3c0;
  --purple:#7346a0;
  --yellow:#b99100;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#06101d;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.app{
  width:100%;
  max-width:none;
  min-height:100dvh;
  background:var(--cream);
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
.banner{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
  object-position:center center;
  background:#111;
}
.roundbar{
  background:linear-gradient(90deg,var(--navy),var(--navy2));
  color:#fff;
  display:grid;
  grid-template-columns:1.15fr 1.35fr .9fr;
  gap:0;
  padding:0 10px;
  min-height:clamp(64px, 7.8dvh, 82px);
  border-bottom:2px solid var(--orange);
}
.roundbar>div{
  padding:9px 9px 8px;
  font-size:13px;
  font-weight:900;
  line-height:1.15;
}
.roundbar>div+div{border-left:1px solid #ffffff44}
.roundbar span{
  opacity:.72;
  display:block;
  font-size:9px;
  letter-spacing:.08em;
  margin-bottom:4px;
}
.hole{
  padding:0;
  background:linear-gradient(90deg,#0b8f94 0 23%,#f8f1e2 23% 100%);
  border-bottom:0;
}
.holegrid{
  display:grid;
  grid-template-columns:23% 1fr 1fr 1.2fr;
  min-height:var(--hole-h);
  align-items:stretch;
}
.big7{
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:clamp(48px, 8dvh, 68px);
  line-height:1;
  font-weight:1000;
  font-family:Impact,Arial Black,sans-serif;
  text-shadow:0 2px 0 #0003;
}
.big7::before{
  content:"HOLE";
  position:absolute;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:.05em;
  transform:translateY(-31px);
}
.metric{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-left:1px solid #0002;
  text-align:center;
}
.metric b{
  display:block;
  font-family:Impact,Arial Black,sans-serif;
  font-size:clamp(32px, 5.4dvh, 44px);
  line-height:.9;
}
.metric small{
  font-weight:900;
  font-size:11px;
  letter-spacing:.08em;
  margin-bottom:3px;
}
.metric.si b{color:var(--orange)}
.metric.yds{
  border-left:1px solid #0002;
  margin:5px 6px 5px 0;
  background:#dfe7d7;
}
.stable{
  background:#050505;
  color:white;
  text-align:center;
  padding:5px 8px;
  font-weight:900;
  letter-spacing:.03em;
  font-size:15px;
}
.stable em{color:#1db3b8;font-style:normal}
.note{
  padding:8px 12px;
  font-size:11px;
  line-height:1.25;
  background:#fff3c7;
  color:#5c4700;
  text-align:center;
  border-bottom:1px solid #e5d7a9;
}
.head,.player{
  display:grid;
  grid-template-columns:18% 34% 16% 14% 18%;
  align-items:center;
}
.head{
  min-height:30px;
  padding:0 8px;
  font-size:9px;
  font-weight:900;
  text-align:center;
  border-bottom:1px solid #0002;
}
.head div:first-child{text-align:left}
.player{
  min-height:var(--player-h);
  padding:3px 7px;
  border-bottom:1px solid #0002;
}
.name{
  font-family:Impact,Arial Black,sans-serif;
  font-size:28px;
  font-style:italic;
  letter-spacing:.02em;
}
.controls{
  display:grid;
  grid-template-columns:44px minmax(52px,1fr) 44px;
  gap:5px;
}
button{font:inherit}
.minus,.plus{
  border:0;
  border-radius:7px;
  background:var(--teal);
  color:white;
  font-size:28px;
  font-weight:900;
  min-height:clamp(48px, 6.4dvh, 58px);
  box-shadow:0 2px 0 #0003;
}
.score{
  display:grid;
  place-items:center;
  background:#fffaf1;
  border:1.5px solid #253447;
  border-radius:7px;
  font-size:30px;
  font-weight:1000;
  min-height:clamp(48px, 6.4dvh, 58px);
}
.shots,.pts,.total{
  text-align:center;
  font-weight:1000;
  font-size:10px;
  line-height:1.05;
}
.shots b,.pts b,.total b{
  display:block;
  font-size:27px;
  line-height:1;
  margin-bottom:3px;
}
.total{
  background:#0a0a0a;
  color:white;
  border-radius:7px;
  padding:5px 2px;
}
.player[data-p="DCM"] .name,.player[data-p="DCM"] .shots b,.player[data-p="DCM"] .pts b,.player[data-p="DCM"] .total b{color:var(--orange)}
.player[data-p="STU"] .name,.player[data-p="STU"] .shots b,.player[data-p="STU"] .pts b,.player[data-p="STU"] .total b{color:var(--yellow)}
.player[data-p="GEN"] .name,.player[data-p="GEN"] .shots b,.player[data-p="GEN"] .pts b,.player[data-p="GEN"] .total b{color:var(--purple)}
.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  min-height:30px;
  padding:5px 8px;
  background:#050505;
  color:white;
  font-weight:800;
  font-size:10px;
}
.status strong{color:#1db3b8}
.nav{
  display:grid;
  grid-template-columns:1fr 1.45fr 1fr;
  gap:8px;
  padding:5px 8px calc(5px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#06101d,#081625);
  position:sticky;
  bottom:0;
  z-index:5;
}
.nav button{
  min-height:var(--nav-h);
  border:1.5px solid var(--teal);
  background:#0a1726;
  color:white;
  border-radius:9px;
  padding:8px 4px;
  font-weight:1000;
  font-size:13px;
}
.nav .next{
  background:linear-gradient(90deg,#0a8f95,#0aa1a5);
  font-family:Impact,Arial Black,sans-serif;
  font-size:23px;
  letter-spacing:.02em;
}

/* Height-aware tuning: short phones compress, tall phones breathe. */
@media (max-height:760px){
  :root{
    --banner-h:84px;
    --round-h:60px;
    --hole-h:118px;
    --player-h:68px;
    --nav-h:68px;
  }
  .stable{font-size:13px;padding:4px 8px}
  .head{min-height:28px}
  .status{min-height:28px}
}
@media (min-height:900px){
  :root{
    --banner-h:136px;
    --round-h:72px;
    --hole-h:156px;
    --player-h:88px;
    --nav-h:88px;
  }
  .stable{font-size:16px;padding:7px 10px}
  .head{min-height:36px}
  .status{min-height:36px}
}

@media (min-width:700px){
  .app{max-width:430px;margin:0 auto;box-shadow:0 0 24px #0008}
}
@media (max-width:390px){
  .roundbar>div{font-size:11px;padding-left:6px;padding-right:6px}
  .holegrid{min-height:100%}
  .big7{font-size:clamp(40px, 6.2dvh, 58px); line-height:.88}
  .metric b{font-size:clamp(30px, 4.8dvh, 40px)}
  .name{font-size:25px}
  .controls{grid-template-columns:40px minmax(48px,1fr) 40px}
  .minus,.plus,.score{min-height:46px}
  .shots b,.pts b,.total b{font-size:24px}
}

/* 1.5.2 — Hole number scales down as usable screen height shrinks. */
@media (max-height: 850px){
  .big7{font-size:clamp(38px, 5.8dvh, 50px); line-height:.86}
}
@media (max-height: 740px){
  .big7{font-size:clamp(34px, 5.2dvh, 44px); line-height:.84}
}


/* 1.5.3 — short-phone vertical refinement */
@media (max-height: 900px) {
  /* Pull the hole/par/SI/yardage row upward by trimming the spare bottom
     space in the round-details area. */
  .meta { padding-bottom: 2px !important; }

  /* Re-centre HOLE content lower inside its teal cell. */
  .holeCard { padding-top: 8px !important; }
  .holeCard .small { transform: translateY(2px); }

  /* Keep HOLE deliberately larger than PAR/SI, but responsive to height. */
  .big7 {
    font-size: clamp(46px, 6.5dvh, 58px);
    line-height: .90;
    transform: translateY(4px);
  }
}
@media (max-height: 780px) {
  .meta { padding-bottom: 0 !important; }
  .holeCard { padding-top: 6px !important; }
  .big7 {
    font-size: clamp(42px, 6dvh, 52px);
    transform: translateY(3px);
  }
}


/* 1.5.4 — keep HOLE label + number fully inside the teal cell */
.big7{
  position:relative;
  top:auto !important;
  transform:translateY(8px) !important;
  font-size:clamp(48px, 6.6dvh, 60px) !important;
  line-height:.88 !important;
}
.big7::before{
  transform:translateY(-34px) !important;
  font-size:11px !important;
}

@media (max-height:850px){
  .big7{
    transform:translateY(7px) !important;
    font-size:clamp(44px, 6.1dvh, 54px) !important;
  }
  .big7::before{
    transform:translateY(-30px) !important;
  }
}
@media (max-height:740px){
  .big7{
    transform:translateY(6px) !important;
    font-size:clamp(40px, 5.7dvh, 49px) !important;
  }
  .big7::before{
    transform:translateY(-27px) !important;
  }
}


/* 1.7.0 — round selector + expenses link */
.roundSelect{
  width:100%;
  background:transparent;
  color:#fff;
  border:0;
  outline:0;
  padding:0;
  margin:0;
  font:inherit;
  font-weight:900;
  text-transform:uppercase;
  appearance:auto;
}
.roundSelect option{
  color:#111;
  background:#fff;
  text-transform:none;
}
.expensesLink{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:var(--nav-h);
  border:1.5px solid var(--orange);
  background:#16110c;
  color:#fff;
  border-radius:9px;
  padding:8px 4px;
  font-weight:1000;
  font-size:13px;
  text-decoration:none;
}


/* RyderCup2018.9 — central score loading state */
.score-loading .minus,
.score-loading .plus{
  opacity:.45;
  pointer-events:none;
  filter:grayscale(.35);
}


/* RyderCup2018.11 — simplified round/course header */
.roundbarSimple{grid-template-columns:minmax(0,2.15fr) minmax(108px,.85fr)}
.roundbarSimple>div:nth-child(2){border-left:1px solid rgba(255,255,255,.18)}
.roundCourse{position:relative;min-width:0}
.courseDisplay{position:relative;padding-right:20px;font-weight:900;font-size:18px;line-height:1.08;white-space:normal;overflow:visible}
.courseDisplay::after{content:"⌄";position:absolute;right:0;top:1px;font-size:15px;line-height:1;font-weight:700}
.roundSelectOverlay{position:absolute;left:0;right:0;top:25px;bottom:0;width:100%;height:calc(100% - 25px);opacity:0;z-index:3;cursor:pointer}

/* RyderCup2022.1 — Golf Scorecard / Leaderboard toggle */
.golfToggle{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#071522;
  border-bottom:3px solid #f36b18;
}
.golfToggle button,
.golfToggle a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:8px 10px;
  border:0;
  text-decoration:none;
  font-weight:900;
  letter-spacing:.35px;
  font-size:14px;
}
.golfToggle button.active{
  background:#f4eddf;
  color:#0d1b36;
}
.golfToggle a{
  background:#071522;
  color:#f4eddf;
  border-left:1px solid rgba(255,255,255,.16);
}


/* RyderCup2022.4 — optional Pairings selector */
.pairingsBar{
  background:#071522;
  color:#f4eddf;
  border-bottom:3px solid #f36b18;
  padding:8px 10px 10px;
}
.pairingsBar[hidden]{display:none}
.pairingsTitle{
  text-align:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:.65px;
  opacity:.82;
  margin-bottom:7px;
}
.pairingsChoices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.pairingsChoices button{
  min-height:42px;
  border:2px solid #1aa0a4;
  border-radius:9px;
  background:#071522;
  color:#f4eddf;
  font-size:13px;
  line-height:1.15;
  font-weight:900;
  padding:6px 8px;
}
.pairingsChoices button.active{
  background:#1aa0a4;
  color:white;
}
.pairingsPrompt{
  padding:24px 16px;
  text-align:center;
  font-weight:900;
  color:#6d7480;
}


/* RyderCup2022.5.1 — corrected compact four-player mode.
   Pairings mode is left exactly as in V2.4. */
body.fourBallCompact{
  /* V1.1: compact, viewport-aware four-ball fit. */
  --hole-h:clamp(80px,13.5dvh,88px);
  --player-h:clamp(56px,9.4dvh,62px);
  --nav-h:clamp(58px,9.8dvh,64px);
}

body.fourBallCompact .banner{
  /* Match the proven Expenses banner treatment: show the complete 1200:346 artwork. */
  width:100%;
  height:auto;
  aspect-ratio:1200/346;
  object-fit:cover;
  object-position:center center;
}

body.fourBallCompact .roundbar{
  min-height:56px;
}
body.fourBallCompact .roundbar>div{
  padding-top:6px;
  padding-bottom:5px;
}

body.fourBallCompact .golfToggle button,
body.fourBallCompact .golfToggle a{
  min-height:36px;
  padding:5px 8px;
}

body.fourBallCompact .stable{
  padding:3px 8px;
  font-size:13px;
}

body.fourBallCompact .head{
  min-height:24px;
}

body.fourBallCompact .player{
  padding-top:2px;
  padding-bottom:2px;
}

body.fourBallCompact .status{
  min-height:24px;
  padding:3px 8px;
}

body.fourBallCompact .nav{
  padding-top:3px;
  padding-bottom:calc(3px + env(safe-area-inset-bottom));
}
body.fourBallCompact .nav button{
  min-height:var(--nav-h);
}
.navQuick{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.navQuick .expensesLink{min-width:0;min-height:var(--nav-h);padding:5px 2px;font-size:10px;line-height:1.15;text-align:center}
.photoLink{border-color:var(--teal) !important;background:#0a1726 !important}

/* Do not shrink the actual scoring controls below their proven sizes. */
body.fourBallCompact .minus,
body.fourBallCompact .plus,
body.fourBallCompact .score{
  min-height:48px;
}


/* ============================================================
   SGT26 Scorecard Open-Board Skin V1
   Visual-only reskin: yellow board, navy rails, mechanical tiles.
   ============================================================ */

:root{
  --board:#e2ad28;
  --board2:#d89b18;
  --boardInk:#10213b;
  --boardSlot:#ead59b;
}

/* Keep the established Tour header / tabs exactly as the family look. */
.hole{
  position:relative;
  background:linear-gradient(180deg,var(--board),var(--board2));
  border-top:3px solid var(--boardInk);
  border-bottom:3px solid var(--boardInk);
  padding:6px;
}
.hole::before,
.hole::after{
  content:"";
  position:absolute;
  width:9px;height:9px;border-radius:50%;
  background:#8a6a1b;border:1px solid #5f4810;
  box-shadow:inset 1px 1px #d4b456;
  top:6px;
}
.hole::before{left:6px}
.hole::after{right:6px}

.holegrid{
  grid-template-columns:23% 1fr 1fr 1.2fr;
  min-height:var(--hole-h);
  border:3px solid var(--boardInk);
  background:transparent;
}
.big7,
.metric{
  color:var(--boardInk);
  background:transparent;
  border-left:2px solid rgba(16,33,59,.35);
}
.big7{border-left:0!important;text-shadow:none}
.big7::before{color:var(--boardInk)}
.metric small{color:var(--boardInk);opacity:.82}
.metric.si b{color:var(--boardInk)}
.metric.yds{
  margin:0;
  background:transparent;
  border-left:2px solid rgba(16,33,59,.35);
}

/* Mechanical number tile treatment. */
.big7,
.metric b,
.score,
.pts b,
.total b{
  position:relative;
}
.big7,
.metric b,
.score{
  background:linear-gradient(
    #f5e9bd 0%,
    #e8d69d 49%,
    #d7be7d 50%,
    #ebd9a2 100%
  );
  border:2px solid rgba(16,33,59,.48);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.24),
    0 2px 1px rgba(0,0,0,.16);
}
.big7::after,
.metric b::after,
.score::after{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:1px;
  background:rgba(16,33,59,.27);
  pointer-events:none;
}
.big7{
  margin:7px;
  border-radius:2px;
}
.metric b{
  min-width:64%;
  padding:8px 6px;
  border-radius:2px;
}
.score{
  overflow:hidden;
  border-radius:2px;
  color:var(--boardInk);
  font-family:"Arial Narrow",Arial,sans-serif;
  background:linear-gradient(
    #f5e9bd 0%,
    #e8d69d 49%,
    #d7be7d 50%,
    #ebd9a2 100%
  );
}

/* Flip animation: the upper half folds away when a score changes. */
.score .flipFace{
  position:relative;
  z-index:2;
}
.score.flipAnimate::before{
  content:attr(data-old);
  position:absolute;
  left:0;right:0;top:0;
  height:50%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:0;
  overflow:hidden;
  background:linear-gradient(#f5e9bd,#e8d69d);
  color:var(--boardInk);
  font:inherit;
  font-weight:inherit;
  transform-origin:bottom;
  backface-visibility:hidden;
  z-index:4;
  animation:sgtFlipTop .32s ease-in forwards;
}
.score.flipAnimate::after{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:1px;
  background:rgba(16,33,59,.32);
  z-index:5;
}
@keyframes sgtFlipTop{
  0%{transform:perspective(260px) rotateX(0deg);filter:brightness(1)}
  55%{transform:perspective(260px) rotateX(-72deg);filter:brightness(.86)}
  100%{transform:perspective(260px) rotateX(-90deg);filter:brightness(.72)}
}

.stable{
  background:var(--boardInk);
  color:#fff7df;
  border-bottom:3px solid var(--boardInk);
}
.stable em{color:#ffd86a}

.head{
  background:var(--boardInk);
  color:#fff7df;
  border-bottom:0;
}
#players{
  background:linear-gradient(180deg,var(--board),var(--board2));
}
.player{
  position:relative;
  background:transparent;
  color:var(--boardInk);
  border-bottom:2px solid rgba(16,33,59,.42);
}
.player::before{
  content:"";
  position:absolute;
  width:8px;height:8px;border-radius:50%;
  background:#8a6a1b;border:1px solid #5f4810;
  left:3px;top:4px;
  box-shadow:inset 1px 1px #d4b456;
}
.name{
  color:var(--boardInk)!important;
  font-family:Arial,Helvetica,sans-serif;
  font-style:normal;
  font-size:26px;
  font-weight:1000;
}
.playerIdent{
  display:flex;
  align-items:center;
  gap:6px;
}
.flagSvg{
  width:30px;
  height:20px;
  flex:0 0 auto;
  border:1px solid rgba(16,33,59,.5);
  box-shadow:0 1px 1px rgba(0,0,0,.18);
}
.minus,.plus{
  background:var(--boardInk);
  border:2px solid #081525;
  color:#fff7df;
  border-radius:4px;
}
.plus{background:#0b8f94;border-color:#086d71}

.shots,.pts,.total{color:var(--boardInk)}
.shots b{color:var(--boardInk)!important}
.pts,
.total{
  background:transparent;
  color:var(--boardInk);
  border-radius:0;
  padding:0;
}
.pts b,
.total b{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  margin:0 4px 3px;
  padding:4px 2px;
  border:2px solid rgba(16,33,59,.46);
  border-radius:2px;
  background:linear-gradient(
    #f5e9bd 0%,
    #e8d69d 49%,
    #d7be7d 50%,
    #ebd9a2 100%
  );
  color:var(--boardInk)!important;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);
}
.pts b::after,
.total b::after{

<script>
const DATA_ENDPOINT = "https://script.google.com/macros/s/AKfycbz06cod2GzirOUT7HCyMLgzF9RLJE8psZQqEQFSzrKut3fYMGVsRicuEutsFabVNelm/exec";
const scorecardParams=new URLSearchParams(window.location.search);
const requestedRound=Number(scorecardParams.get('round'));
const requestedHole=Number(scorecardParams.get('hole'));
let currentRound=(Number.isInteger(requestedRound)&&requestedRound>=1&&requestedRound<=6)?requestedRound:+(localStorage.sgt26Round||1);
if(Number.isInteger(requestedRound)&&requestedRound>=1&&requestedRound<=6) localStorage.sgt26Round=requestedRound;

let players = [];
let holes = [];
let roundData = null;
let pairingsConfig = null;
let selectedPairingGroup = null;

function holeStorageKey(){ return `sgt26Hole_r${currentRound}`; }
function scoreStorageKey(){ return `sgt26Scores_r${currentRound}`; }

let hole=(Number.isInteger(requestedHole)&&requestedHole>=1&&requestedHole<=18)?requestedHole:+(localStorage.getItem(holeStorageKey())||1);
if(Number.isInteger(requestedHole)&&requestedHole>=1&&requestedHole<=18) localStorage.setItem(holeStorageKey(),requestedHole);
let scores = JSON.parse(localStorage.getItem(scoreStorageKey()) || '{}');

function shotsOnHole(ch,si){
  return Math.floor(ch/18)+(si <= (ch%18) ? 1 : 0);
}

function stableford(gross,par,shots){
  if(!gross) return null;
  return Math.max(0, 2 + par + shots - gross);
}

function totalFor(pid){
  let t=0;
  for(let h=1;h<=18;h++){
    const gross=scores[pid]?.[h];
    if(gross && holes[h-1]){
      const current=holes[h-1];
      const p=players.find(x=>x.id===pid);
      if(p) t+=stableford(gross,current.par,shotsOnHole(p.ch,current.si));
    }
  }
  return t;
}

function save(){
  localStorage.setItem(scoreStorageKey(), JSON.stringify(scores));
  localStorage.setItem(holeStorageKey(), hole);
  localStorage.sgt26Round = currentRound;
}

function formatRoundDate(value){
  const m=String(value||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return String(value||'').toUpperCase();
  const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
  return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})
    .format(d).toUpperCase().replace(',','');
}


function syncLeaderboardLink(){
  const link=document.getElementById('leaderboardLink');
  if(link){
    link.href=`leaderboard.html?round=${currentRound}`;
  }
}

function renderRoundMeta(){
  if(!roundData) return;
  document.getElementById('roundLabel').textContent=`ROUND ${roundData.round}`;
  document.getElementById('roundSelect').value=String(roundData.round);
  syncLeaderboardLink();
  const teeText=String(roundData.tee||'').trim();
  document.getElementById('courseDisplay').textContent=
    `${String(roundData.course||'').toUpperCase()}${teeText ? ' · ' + teeText.toUpperCase() + ' TEE' : ''}`;
  document.getElementById('teeTime').textContent=String(roundData.teeTime||'TBD').toUpperCase();
}


function pairingStorageKey(){
  return `sgt26PairingGroup_r${currentRound}`;
}

function pairingActiveForCurrentRound(){
  return !!(
    pairingsConfig &&
    pairingsConfig.enabled === true &&
    Number(pairingsConfig.round) === currentRound
  );
}

function getVisiblePlayers(){
  if(!pairingActiveForCurrentRound()){
    return players;
  }

  const group=selectedPairingGroup;
  if(group!=='A' && group!=='B'){
    return [];
  }

  const ids=Array.isArray(pairingsConfig.groups?.[group])
    ? pairingsConfig.groups[group]
    : [];

  return players.filter(p=>ids.includes(p.id));
}

function updatePairingsUI(){
  const bar=document.getElementById('pairingsBar');
  const a=document.getElementById('pairA');
  const b=document.getElementById('pairB');

  const pairingsActive=pairingActiveForCurrentRound();
  document.body.classList.toggle('fourBallCompact', !pairingsActive);

  if(!pairingsActive){
    bar.hidden=true;
    selectedPairingGroup=null;
    return;
  }

  bar.hidden=false;

  const groupA=pairingsConfig.groups?.A || [];
  const groupB=pairingsConfig.groups?.B || [];

  a.textContent=`GROUP A · ${groupA.join(' / ')}`;
  b.textContent=`GROUP B · ${groupB.join(' / ')}`;

  const saved=String(localStorage.getItem(pairingStorageKey())||'').toUpperCase();
  if(saved==='A' || saved==='B'){
    selectedPairingGroup=saved;
  }

  a.classList.toggle('active',selectedPairingGroup==='A');
  b.classList.toggle('active',selectedPairingGroup==='B');
}

function selectPairingGroup(group){
  if(group!=='A' && group!=='B') return;
  selectedPairingGroup=group;
  localStorage.setItem(pairingStorageKey(),group);
  updatePairingsUI();
  render();
}

function loadPairingsConfig(){
  return apiJsonp({service:'scorecards',action:'pairings'}).then(config=>{
    pairingsConfig=config||{enabled:false,round:0,groups:{A:[],B:[]}};
    cachePairingsConfig(pairingsConfig);
    selectedPairingGroup=null; updatePairingsUI(); render(); return pairingsConfig;
  }).catch(error=>{
    console.error('Pairings config load failed:',error);
    pairingsConfig=getCachedPairingsConfig()||{enabled:false,round:0,groups:{A:[],B:[]}};
    selectedPairingGroup=null; updatePairingsUI(); render(); setOfflineStatus(); return pairingsConfig;
  });
}


function playerFlagMarkup(player){
  if(player==='PGB'||player==='STU'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="England">
      <rect width="60" height="36" fill="#fff"/>
      <rect x="25" width="10" height="36" fill="#c8102e"/>
      <rect y="13" width="60" height="10" fill="#c8102e"/>
    </svg>`;
  }

  if(player==='DCM'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="South Africa">
      <rect width="60" height="18" fill="#de3831"/>
      <rect y="18" width="60" height="18" fill="#002395"/>
      <path d="M0 0 L28 18 L0 36Z" fill="#000"/>
      <path d="M0 4 L22 18 L0 32" fill="none" stroke="#ffb612" stroke-width="7"/>
      <path d="M0 7 L18 18 L0 29 M18 18 H60" fill="none" stroke="#fff" stroke-width="9"/>
      <path d="M0 7 L18 18 L0 29 M18 18 H60" fill="none" stroke="#007a4d" stroke-width="5"/>
    </svg>`;
  }

  if(player==='GEN'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="Dominican Republic">
      <rect width="60" height="36" fill="#fff"/>
      <rect width="25" height="14" fill="#002d62"/>
      <rect x="35" width="25" height="14" fill="#ce1126"/>
      <rect y="22" width="25" height="14" fill="#ce1126"/>
      <rect x="35" y="22" width="25" height="14" fill="#002d62"/>
      <circle cx="30" cy="18" r="3" fill="#006847"/>
    </svg>`;
  }

  return '';
}

let flipPlayer = '';
let flipOldGross = '–';
function render(){
  if(!holes.length || !players.length) return;

  hole=Math.max(1,Math.min(holes.length,hole));
  const current=holes[hole-1];
  const par=current.par;
  const si=current.si;

  document.getElementById('holeNo').textContent=current.hole;
  document.getElementById('par').textContent=par;
  document.getElementById('si').textContent=si;
  const displayYards =
    Number.isFinite(current.yards) && current.yards > 0
      ? current.yards
      : (Number.isFinite(current.metres) && current.metres > 0
          ? Math.round(current.metres * 1.09361)
          : '—');
  document.getElementById('yards').textContent=displayYards;

  const wrap=document.getElementById('players');
  wrap.innerHTML='';

  let bestPts=-1,best=[];

  const visiblePlayers=getVisiblePlayers();

  if(pairingActiveForCurrentRound() && visiblePlayers.length===0){
    wrap.innerHTML='<div class="pairingsPrompt">Choose GROUP A or GROUP B to begin scoring.</div>';
    document.getElementById('best').textContent='BEST: —';
    return;
  }

  visiblePlayers.forEach(p=>{
    const gross=scores[p.id]?.[hole]||0;
    const sh=shotsOnHole(p.ch,si);
    const pts=stableford(gross,par,sh);

    if(pts!==null){
      if(pts>bestPts){bestPts=pts;best=[p.id]}
      else if(pts===bestPts) best.push(p.id);
    }

    const row=document.createElement('div');
    row.className='player';
    row.dataset.p=p.id;
    const scoreClass =
      flipPlayer===p.id
        ? 'score flipAnimate'
        : 'score';

    row.innerHTML=`<div class="name"><div class="playerIdent">${playerFlagMarkup(p.id)}<span>${p.id}</span></div></div>
      <div class="controls"><button class="minus" onclick="bump('${p.id}',-1)">−</button>
      <div class="${scoreClass}" data-old="${flipPlayer===p.id ? flipOldGross : (gross||'–')}"><span class="flipFace">${gross||'–'}</span></div>
      <button class="plus" onclick="bump('${p.id}',1)">+</button></div>
      <div class="shots"><b>${sh}</b>${sh===1?'SHOT':'SHOTS'}</div>
      <div class="pts"><b>${pts===null?'–':pts}</b>PTS</div>
      <div class="total"><b>${totalFor(p.id)}</b>PTS</div>`;
    wrap.appendChild(row);
  });

  document.getElementById('best').textContent=
    bestPts>=0?`BEST: ${best.join(' / ')} · ${bestPts} PTS`:'BEST: —';
}


/* OpenBoardScorecard1.6 — durable local-to-central sync queue. */
const pendingSyncKey='sgt26PendingScoreSync';

function getPendingSync(){
  try{return JSON.parse(localStorage.getItem(pendingSyncKey)||'{}');}
  catch(_){return {};}
}
function savePendingSync(queue){
  localStorage.setItem(pendingSyncKey,JSON.stringify(queue));
}
function pendingItemKey(roundNumber,pid,holeNumber){
  return `${roundNumber}|${pid}|${holeNumber}`;
}
function queueScoreSync(roundNumber,pid,holeNumber,gross){
  const queue=getPendingSync();
  const key=pendingItemKey(roundNumber,pid,holeNumber);
  queue[key]={round:Number(roundNumber),player:String(pid),hole:Number(holeNumber),gross:Number(gross)};
  savePendingSync(queue);
}
function removeQueuedScore(item){
  const queue=getPendingSync();
  delete queue[pendingItemKey(item.round,item.player,item.hole)];
  savePendingSync(queue);
}
function pendingSyncCount(){
  return Object.keys(getPendingSync()).length;
}
let syncInProgress=false;

async function flushPendingScores(){
  if(syncInProgress || navigator.onLine===false) return;
  const items=Object.values(getPendingSync());
  if(!items.length){setSaveStatus('AUTO SAVED');return;}

  syncInProgress=true;
  setSaveStatus(`SYNCING ${items.length}…`);
  try{
    for(const item of items){
      if(navigator.onLine===false) break;
      await apiJsonp({
        service:'scorecards',
        action:'saveScore',
        round:item.round,
        hole:item.hole,
        player:item.player,
        gross:item.gross
      });
      removeQueuedScore(item);
    }
  }catch(error){
    console.error('Pending score sync paused:',error);
  }finally{
    syncInProgress=false;
    const remaining=pendingSyncCount();
    if(remaining===0 && navigator.onLine!==false) setSaveStatus('AUTO SAVED');
    else if(navigator.onLine===false) setOfflineStatus();
    else setSaveStatus(`LOCAL · ${remaining} TO SYNC`,true);
  }
}

function bump(pid,d){
  if(document.body.classList.contains('score-loading')) return;
  scores[pid]??={};
  let n=scores[pid][hole]||0;
  const oldGross=n||'–';
  n=Math.max(0,Math.min(15,n+d));

  if(n===0) delete scores[pid][hole];
  else scores[pid][hole]=n;

  const holeToSave=hole;
  const grossToSave=n;

  flipPlayer=pid;
  flipOldGross=oldGross;

  save();
  render();

  window.setTimeout(()=>{
    flipPlayer='';
  },360);

  queueScoreSync(currentRound,pid,holeToSave,grossToSave);
  if(navigator.onLine===false){
    setOfflineStatus();
  }else{
    flushPendingScores();
  }
}

function move(d){
  if(!holes.length) return;
  hole=Math.max(1,Math.min(holes.length,hole+d));
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetRound(){
  if(confirm('Clear local cached scores on this phone? Central saved scores will remain.')){
    scores={};
    hole=1;
    save();
    render();
  }
}


function apiJsonp(params){
  return new Promise((resolve,reject)=>{
    const callbackName=`sgt26Api_${Date.now()}_${Math.floor(Math.random()*100000)}`;
    const script=document.createElement('script');

    const cleanup=()=>{
      try{ delete window[callbackName]; }catch(_){}
      script.remove();
    };

    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error('Backend request timed out.'));
    },15000);

    window[callbackName]=payload=>{
      clearTimeout(timer);
      cleanup();
      if(!payload || payload.ok===false){
        reject(new Error(payload?.error || 'Backend request failed.'));
        return;
      }
      resolve(payload.data);
    };

    script.onerror=()=>{
      clearTimeout(timer);
      cleanup();
      reject(new Error('Unable to contact backend.'));
    };

    const query=new URLSearchParams({
      ...params,
      callback:callbackName,
      v:APP_VERSION
    });

    script.src=`${DATA_ENDPOINT}?${query.toString()}`;
    document.head.appendChild(script);
  });
}

function setSaveStatus(text,isError=false){
  const status=document.querySelector('.status strong');
  if(!status) return;
  status.textContent=text;
  status.style.color=isError ? '#f36b18' : '';
}

function setScoreLoading(isLoading){
  document.body.classList.toggle('score-loading',isLoading);
  if(isLoading){
    setSaveStatus('LOADING SCORES…');
  }
}

function applyCentralScores(savedScores){
  if(!Array.isArray(savedScores)) return;

  // Central storage is authoritative whenever the backend is reachable.
  // Replace this round's local/prototype cache with exactly what the
  // Scores sheet returned.
  scores={};

  savedScores.forEach(item=>{
    const pid=String(item.player||'').toUpperCase();
    const h=Number(item.hole);
    const gross=Number(item.gross);

    if(!pid || !h || !gross) return;

    scores[pid]??={};
    scores[pid][h]=gross;
  });

  save();
}

function loadCentralScores(){
  setScoreLoading(true);

  return apiJsonp({
    service:'scorecards',
    action:'scores',
    round:currentRound
  }).then(saved=>{
    applyCentralScores(saved);
    render();
    setScoreLoading(false);
    setSaveStatus('AUTO SAVED');
  }).catch(error=>{
    setScoreLoading(false);
    console.error('Central score load failed:',error);
    setSaveStatus('LOCAL ONLY',true);
    throw error;
  });
}

function saveCentralScore(pid,holeNumber,gross){
  setSaveStatus('SAVING…');

  return apiJsonp({
    service:'scorecards',
    action:'saveScore',
    round:currentRound,
    hole:holeNumber,
    player:pid,
    gross:gross
  }).then(()=>{
    setSaveStatus('AUTO SAVED');
  }).catch(error=>{
    console.error('Central score save failed:',error);
    setSaveStatus('LOCAL ONLY',true);
    throw error;
  });
}


function roundCacheKey(roundNumber=currentRound){return `sgt26RoundPayload_r${roundNumber}`;}
function cacheRoundPayload(payload){try{localStorage.setItem(roundCacheKey(),JSON.stringify(payload));}catch(_){}}
function getCachedRoundPayload(){try{return JSON.parse(localStorage.getItem(roundCacheKey())||'null');}catch(_){return null;}}
function pairingsCacheKey(){return 'sgt26PairingsConfig';}
function cachePairingsConfig(config){try{localStorage.setItem(pairingsCacheKey(),JSON.stringify(config));}catch(_){}}
function getCachedPairingsConfig(){try{return JSON.parse(localStorage.getItem(pairingsCacheKey())||'null');}catch(_){return null;}}
function setOfflineStatus(){setScoreLoading(false);setSaveStatus('LOCAL ONLY',true);}

function applyRoundPayload(payload){
  if(!payload || !payload.ok || !payload.data){
    throw new Error(payload?.error || 'Invalid round-data response.');
  }

  cacheRoundPayload(payload);
  roundData=payload.data.round;
  players=payload.data.players.map(p=>({id:String(p.player),ch:Number(p.playingHandicap)}));
  holes=payload.data.holes.map(h=>({
    hole:Number(h.hole),
    par:Number(h.par),
    si:Number(h.si),
    metres:Number(h.metres),
    yards:Number(h.yards)
  }));

  if(holes.length!==18) throw new Error(`Expected 18 holes, received ${holes.length}.`);

  renderRoundMeta();
  render();
}

function loadRoundData(){
  return new Promise((resolve,reject)=>{
    const cachedFallback=(error)=>{
      const cached=getCachedRoundPayload();
      if(!cached){reject(error||new Error('No cached round data.'));return;}
      try{applyRoundPayload(cached);setOfflineStatus();resolve({offline:true});}
      catch(e){reject(e);}
    };
    if(navigator.onLine===false){cachedFallback(new Error('Device offline.'));return;}
    const callbackName=`sgt26RoundCallback_${Date.now()}`;
    const script=document.createElement('script');
    const cleanup=()=>{try{delete window[callbackName];}catch(_){} script.remove();};
    const timer=setTimeout(()=>{cleanup();cachedFallback(new Error('Round data timed out.'));},6000);
    window[callbackName]=payload=>{
      clearTimeout(timer);cleanup();
      try{applyRoundPayload(payload);resolve({offline:false});}catch(e){cachedFallback(e);}
    };
    script.onerror=()=>{clearTimeout(timer);cleanup();cachedFallback(new Error('Unable to load round data.'));};
    script.src=`${DATA_ENDPOINT}?service=scorecards&action=round&round=${currentRound}&callback=${encodeURIComponent(callbackName)}&v=${encodeURIComponent(APP_VERSION)}`;
    document.head.appendChild(script);
  });
}


function switchRound(roundNumber){
  const nextRound=Number(roundNumber);
  if(!Number.isInteger(nextRound) || nextRound<1 || nextRound>6 || nextRound===currentRound) return;

  currentRound=nextRound;
  localStorage.sgt26Round=currentRound;

  hole=+(localStorage.getItem(holeStorageKey()) || 1);
  scores=JSON.parse(localStorage.getItem(scoreStorageKey()) || '{}');

  document.getElementById('best').textContent='LOADING…';
  setScoreLoading(true);

  loadRoundData()
    .then(()=>loadPairingsConfig())
    .then(()=>navigator.onLine===false ? (setOfflineStatus(),null) : loadCentralScores())
    .then(()=>window.scrollTo({top:0,behavior:'smooth'}))
    .catch(error=>{
      console.error('SGT26 round switch failed:',error);
      document.getElementById('best').textContent='DATA ERROR';
    });
}


document.getElementById('pairA').addEventListener('click',()=>selectPairingGroup('A'));
document.getElementById('pairB').addEventListener('click',()=>selectPairingGroup('B'));

document.getElementById('roundSelect').addEventListener('change',e=>{
  switchRound(e.target.value);
});

/* Prototype reset is retained without consuming a main navigation button:
   double-tap/click the AUTO SAVED status strip to reset the current round. */
document.querySelector('.status').addEventListener('dblclick',resetRound);

function syncPhotosLink(){
  const link=document.getElementById('photosLink');
  if(link) link.href=`photos.html?from=scorecard&round=${currentRound}&hole=${hole}`;
}
document.getElementById('photosLink').addEventListener('click',syncPhotosLink);
window.addEventListener('offline',()=>setOfflineStatus());
window.addEventListener('online',()=>{
  setSaveStatus('ONLINE · LOCAL SCORES');
  flushPendingScores();
});
document.getElementById('roundSelect').value=String(currentRound);
syncPhotosLink();
setScoreLoading(true);

loadRoundData()
  .then(()=>loadPairingsConfig())
  .then(()=>navigator.onLine===false ? (setOfflineStatus(),null) : loadCentralScores())
  .then(()=>navigator.onLine===false ? null : flushPendingScores())
  .catch(error=>{
    console.error('SGT26 initial load failed:',error);
    document.getElementById('best').textContent='DATA ERROR';
    setSaveStatus('LOCAL ONLY',true);
  });
// RyderCup2022.5.1 corrected compact four-player layout enabled
