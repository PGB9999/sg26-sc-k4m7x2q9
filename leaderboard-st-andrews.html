<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b36">
  <title>Spanish Golf Tour 2026 — St Andrews Leaderboard</title>
  <style>
:root{
  --ink:#10213b;
  --gold:#efb91d;
  --gold2:#dca20f;
  --cream:#f2df9e;
  --navy:#09182b;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#cdd7e4;
}
.scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#ccd7e4 url('st-andrews-bg.png') center center/cover no-repeat;
}
.scene::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.02),rgba(0,0,0,.08));
  pointer-events:none;
}
.board{
  position:absolute;
  left:3.5%;
  top:47.0%;
  width:58.5%;
  height:46.5%;
  display:flex;
  flex-direction:column;
  background:linear-gradient(#f2bb1d,#dca10d);
  border:9px solid #0c1a2d;
  box-shadow:
    0 20px 38px rgba(0,0,0,.42),
    inset 0 0 0 2px rgba(255,255,255,.15);
  z-index:2;
}
.boardTop{
  flex:0 0 18%;
  background:linear-gradient(#0c1a2d,#06111f);
  color:#fff;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:1.2% 2.1%;
  border-bottom:4px solid #b7890a;
}
.tourTitle{
  font-size:clamp(27px,2.8vw,52px);
  font-weight:1000;
  letter-spacing:1.2px;
  line-height:.95;
  text-shadow:0 2px 0 rgba(255,255,255,.06);
}
.tourSub{
  display:block;
  margin-top:7px;
  font-size:clamp(10px,.8vw,15px);
  letter-spacing:3px;
  font-weight:900;
  color:#e7c963;
}
.roundMeta{
  text-align:right;
  min-width:230px;
  font-weight:1000;
  line-height:1.05;
}
.roundMeta small{
  display:block;
  font-size:clamp(11px,.95vw,16px);
  letter-spacing:2px;
  color:#d4dce8;
}
.roundMeta strong{
  display:block;
  font-size:clamp(16px,1.35vw,26px);
  margin-top:4px;
}
.roundSelect{
  appearance:none;
  background:transparent;
  border:0;
  color:#fff;
  text-align:right;
  width:100%;
  font:inherit;
  font-size:inherit;
  font-weight:1000;
  outline:0;
  cursor:pointer;
}
.roundSelect option{color:#111;background:#fff}

.boardBody{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:.8%;
}
.boardLabel{
  flex:0 0 auto;
  text-align:center;
  color:var(--ink);
  font-weight:1000;
  letter-spacing:3px;
  font-size:clamp(13px,1.05vw,20px);
  margin-bottom:.9%;
}
.frame{
  flex:1 1 auto;
  min-height:0;
  border:5px solid var(--ink);
  display:flex;
  flex-direction:column;
}
.groupHeads{
  display:grid;
  grid-template-columns:7% 8% 34% 13% 11% 11% 16%;
  background:var(--ink);
  color:#f8edce;
  font-size:clamp(12px,1vw,17px);
  font-weight:1000;
  letter-spacing:1px;
  text-align:center;
}
.groupHeads .blank{grid-column:1/4}
.groupHeads .roundGroup{grid-column:4/6}
.groupHeads .tourGroup{grid-column:6/8}
.groupHeads>div{
  padding:8px 4px;
  border-left:1px solid rgba(255,255,255,.26);
}
.head,.row{
  display:grid;
  grid-template-columns:7% 8% 34% 13% 11% 11% 16%;
}
.head{
  flex:0 0 auto;
  background:var(--ink);
  color:#f8edce;
  font-size:clamp(11px,.9vw,15px);
  font-weight:1000;
  letter-spacing:.8px;
}
.head>div{
  padding:7px 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid rgba(255,255,255,.22);
}
.head>div:nth-child(3){justify-content:flex-start;padding-left:18px}
#rows{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(4,1fr);
}
.row{
  min-height:0;
  border-top:4px solid rgba(16,33,59,.48);
  color:var(--ink);
}
.row>div{
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:4px solid rgba(16,33,59,.34);
}
.row>div:last-child{border-right:0}
.pos,.tourPos{
  font-size:clamp(24px,3.6vh,46px);
  font-weight:1000;
}
.flagCell{padding:0 8px}
.flagSvg{
  width:80%;
  max-width:78px;
  aspect-ratio:5/3;
  border:2px solid rgba(16,33,59,.45);
  box-shadow:0 2px 2px rgba(0,0,0,.2);
}
.player{
  justify-content:flex-start!important;
  padding-left:4%!important;
}
.playerBlock{display:flex;flex-direction:column;justify-content:center}
.playerName{
  font-size:clamp(29px,4.6vh,62px);
  line-height:.88;
  font-weight:1000;
}
.playerCode{
  margin-top:5px;
  font-size:clamp(11px,1.1vw,18px);
  line-height:1;
  font-weight:900;
  letter-spacing:3px;
  opacity:.7;
}
.thru{
  font-size:clamp(24px,3.6vh,46px);
  font-weight:1000;
}
.flip{
  align-self:center;
  position:relative;
  width:82%;
  height:68%;
  min-height:70px;
  border:5px solid #0b1627!important;
  background:#121820;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.08),
    0 3px 2px rgba(0,0,0,.25);
  color:#d6402f;
  font-family:"Arial Narrow",Arial,sans-serif;
  font-size:clamp(31px,4.95vh,62px);
  font-weight:1000;
  letter-spacing:-2px;
}
.flip:after{
  content:"";
  position:absolute;
  left:0;right:0;top:50%;
  height:2px;
  background:#000;
  box-shadow:0 1px rgba(255,255,255,.08);
}
.flip span{position:relative;z-index:2}
.tourPts{font-size:clamp(30px,4.7vh,58px)}
.empty{
  grid-row:1/-1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
}
.screw{
  position:absolute;
  width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d6b34e,#876415 68%,#5e440b 100%);
  border:1px solid #59400a;
  box-shadow:inset 1px 1px rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.35);
  z-index:5;
}
.screw:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1px;background:#4a3509;transform:rotate(-24deg)}
.s1{top:10px;left:10px}.s2{top:10px;right:10px}.s3{bottom:10px;left:10px}.s4{bottom:10px;right:10px}

.status{
  position:absolute;
  left:3.9%;
  bottom:2.0%;
  right:auto;
  z-index:4;
  display:flex;
  gap:14px;
  align-items:center;
  padding:7px 10px;
  border-radius:7px;
  background:rgba(3,10,18,.78);
  color:#fff;
  font-size:11px;
  font-weight:900;
}
.status strong{color:#2bc3c8}
.footer{display:none}

/* V2.2 flower arranging — closer to the approved St Andrews mock-up */
.boardTop{
  grid-template-columns:minmax(0,1.35fr) minmax(230px,.65fr);
}
.tourTitle{
  max-width:590px;
}
.tourSub{
  color:#f0bf2d;
  letter-spacing:2.2px;
}
.roundMeta{
  padding-right:2px;
}
.boardBody{
  padding-top:.8%;
}
.boardLabel{
  margin-bottom:.55%;
  letter-spacing:2.4px;
}
.groupHeads,
.head,
.row{
  grid-template-columns:7.5% 8.5% 37% 12% 10.5% 10% 14.5%;
}
.groupHeads{
  font-size:clamp(10px,.82vw,14px);
}
.head{
  font-size:clamp(10px,.78vw,13px);
}
.head>div{
  padding-top:5px;
  padding-bottom:5px;
}
.player{
  padding-left:3.2%!important;
}
.playerName{
  letter-spacing:-.4px;
}
.playerCode{
  margin-top:2px;
  font-size:clamp(9px,.82vw,13px);
  letter-spacing:1.8px;
  opacity:.72;
}
.flagSvg{
  width:78%;
}
.flip{
  width:78%;
  height:72%;
  min-height:58px;
  border-width:4px!important;
}
.boardFrame,
.frame{
  box-shadow:none;
}
.status{
  font-size:10px;
  padding:5px 8px;
}
@media(max-width:1250px){
  .board{
    left:3.3%;
    width:61%;
  }
  .tourTitle{
    font-size:clamp(26px,3vw,46px);
  }
}

/* V2.3 final flower arranging */
.board{
  transform-origin:left bottom;
}
.boardTop{
  padding-top:1%;
  padding-bottom:1%;
}
.roundMeta small{
  line-height:1;
}
.boardLabel{
  margin-top:0;
  margin-bottom:.35%;
}
.groupHeads>div{
  padding-top:5px;
  padding-bottom:5px;
}
.row{
  border-top-width:3px;
}
.playerCode{
  margin-top:1px;
}
@media(max-height:850px){
  .board{
    top:46%;
    height:47%;
  }
}
</style>
</head>
<body>
<div class="scene">
  <section class="board">
    <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>

    <div class="boardTop">
      <div>
        <div class="tourTitle">SPANISH GOLF TOUR 2026</div>
        <span class="tourSub">ST ANDREWS · HOME OF GOLF</span>
      </div>
      <div class="roundMeta">
        <small id="roundLabel">ROUND 1</small>
        <strong>
          <select id="roundSelect" class="roundSelect" aria-label="Choose round">
            <option value="1">LAS BRISAS · 59 TEE</option>
            <option value="2">LOS ARQUEROS · YELLOW TEE</option>
            <option value="3">ATALAYA GOLF - NEW COURSE · YELLOW TEE</option>
            <option value="4">SANTA CLARA GOLF · YELLOW TEE</option>
            <option value="5">MARBELLA GOLF RESORT · EQUIVALENT TEE</option>
            <option value="6">SANTANA · YELLOW TEE</option>
          </select>
        </strong>
        <small>TEE TIME <span id="teeTime">—</span></small>
      </div>
    </div>

    <div class="boardBody">
      <div class="boardLabel">OFFICIAL TOUR LEADERBOARD</div>
      <div class="frame">
        <div class="groupHeads">
          <div class="blank"></div>
          <div class="roundGroup">THIS ROUND</div>
          <div class="tourGroup">TOUR</div>
        </div>
        <div class="head">
          <div>POS</div><div>FLAG</div><div>PLAYER</div>
          <div>PTS</div><div>AFTER</div><div>POS</div><div>PTS</div>
        </div>
        <div id="rows"><div class="empty">Loading leaderboard…</div></div>
      </div>
    </div>
  </section>

  <div class="status">
    <div>✓ <strong id="updated">UPDATED</strong></div>
    <div id="updatedTime">JUST NOW</div>
  </div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbz06cod2GzirOUT7HCyMLgzF9RLJE8psZQqEQFSzrKut3fYMGVsRicuEutsFabVNelm/exec";
let currentRound=1;
function queryRound(){
  const q=new URLSearchParams(location.search);
  const n=Number(q.get('round')||1);
  return Number.isInteger(n)&&n>=1&&n<=6?n:1;
}


function cacheKey(roundNumber){
  return `sgt26_leaderboard_round_${roundNumber}`;
}

function loadCachedLeaderboard(roundNumber){
  try{
    const raw=localStorage.getItem(cacheKey(roundNumber));
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.data)) return null;
    return parsed;
  }catch(error){
    console.warn('Leaderboard cache read failed:',error);
    return null;
  }
}

function saveCachedLeaderboard(roundNumber,data){
  try{
    localStorage.setItem(
      cacheKey(roundNumber),
      JSON.stringify({
        savedAt:new Date().toISOString(),
        data:data
      })
    );
  }catch(error){
    console.warn('Leaderboard cache write failed:',error);
  }
}

function formatFreshness(iso){
  if(!iso) return 'NO CACHED DATA';
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return 'LAST KNOWN DATA';
  const now=Date.now();
  const secs=Math.max(0,Math.floor((now-d.getTime())/1000));
  if(secs<5) return 'UPDATED JUST NOW';
  if(secs<60) return `UPDATED ${secs}s AGO`;
  const mins=Math.floor(secs/60);
  return `UPDATED ${mins}m AGO`;
}

function showCachedLeaderboard(){
  const cached=loadCachedLeaderboard(currentRound);
  if(!cached) return false;

  currentTourStandings={};
  renderRows(cached.data);
  document.getElementById('updated').textContent='LAST KNOWN';
  document.getElementById('updated').classList.remove('error');
  document.getElementById('freshness').textContent=formatFreshness(cached.savedAt);
  return true;
}

function apiJsonp(params){
  return new Promise((resolve,reject)=>{
    const callbackName=`sgt26Lb_${Date.now()}_${Math.floor(Math.random()*100000)}`;
    const script=document.createElement('script');
    const cleanup=()=>{try{delete window[callbackName]}catch(_){} script.remove()};
    const timeout=setTimeout(()=>{cleanup();reject(new Error('Leaderboard request timed out.'))},15000);

    window[callbackName]=payload=>{
      clearTimeout(timeout);cleanup();
      if(!payload||payload.ok===false){
        reject(new Error(payload?.error||'Leaderboard request failed.'));
        return;
      }
      resolve(payload.data);
    };

    script.onerror=()=>{
      clearTimeout(timeout);cleanup();reject(new Error('Unable to contact leaderboard backend.'));
    };

    const query=new URLSearchParams({...params,callback:callbackName,v:'RyderCup2022.1'});
    script.src=`${API_URL}?${query.toString()}`;
    document.head.appendChild(script);
  });
}

function flagMarkup(player){
  if(player==='PGB'||player==='STU'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="England">
      <rect width="60" height="36" fill="#fff"/><rect x="25" width="10" height="36" fill="#c8102e"/><rect y="13" width="60" height="10" fill="#c8102e"/>
    </svg>`;
  }
  if(player==='DCM'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="South Africa">
      <rect width="60" height="18" fill="#de3831"/><rect y="18" width="60" height="18" fill="#002395"/>
      <path d="M0 0 L28 18 L0 36Z" fill="#000"/><path d="M0 4 L22 18 L0 32" fill="none" stroke="#ffb612" stroke-width="7"/>
      <path d="M0 7 L18 18 L0 29 M18 18 H60" fill="none" stroke="#fff" stroke-width="9"/>
      <path d="M0 7 L18 18 L0 29 M18 18 H60" fill="none" stroke="#007a4d" stroke-width="5"/>
    </svg>`;
  }
  if(player==='GEN'){
    return `<svg class="flagSvg" viewBox="0 0 60 36" aria-label="Dominican Republic">
      <rect width="60" height="36" fill="#fff"/><rect width="25" height="14" fill="#002d62"/><rect x="35" width="25" height="14" fill="#ce1126"/>
      <rect y="22" width="25" height="14" fill="#ce1126"/><rect x="35" y="22" width="25" height="14" fill="#002d62"/>
      <circle cx="30" cy="18" r="3" fill="#006847"/>
    </svg>`;
  }
  return '';
}

function tourStandingsFrom(roundBoards){
  const totals={PGB:0,DCM:0,STU:0,GEN:0};
  roundBoards.forEach(board=>{
    (Array.isArray(board)?board:[]).forEach(item=>{
      if(Object.prototype.hasOwnProperty.call(totals,item.player)){
        totals[item.player]+=Number(item.totalPoints)||0;
      }
    });
  });
  const ordered=Object.entries(totals).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
  let previous=null,position=0;
  const result={};
  ordered.forEach(([player,points],index)=>{
    if(previous===null || points!==previous) position=index+1;
    result[player]={position,points};
    previous=points;
  });
  return result;
}

let currentTourStandings={};
function renderRows(items){
  const host=document.getElementById('rows');
  if(!Array.isArray(items)||!items.length){
    host.innerHTML='<div class="empty">No leaderboard data yet.</div>';
    return;
  }
  const playerNames={
    PGB:'PAUL',
    DCM:'DAVID',
    STU:'STUART',
    GEN:'JEANERIC'
  };
  host.innerHTML=items.map(item=>{
    const tour=currentTourStandings[item.player]||{position:'—',points:0};
    const displayName=playerNames[item.player]||item.player;
    return `
    <div class="row" data-player="${item.player}">
      <div class="pos">${item.position}</div>
      <div class="flagCell">${flagMarkup(item.player)}</div>
      <div class="player"><div class="playerBlock"><span class="playerName">${displayName}</span><span class="playerCode">${item.player}</span></div></div>
      <div class="flip pts"><span>${item.totalPoints}</span></div>
      <div class="thru">${item.thru||'—'}</div>
      <div class="tourPos">${tour.position}</div>
      <div class="flip tourPts"><span>${tour.points}</span></div>
    </div>`;
  }).join('');
}

function updateLinks(){
}

function updateMeta(roundData){
  if(!roundData||!roundData.round)return;
  document.getElementById('roundLabel').textContent=`ROUND ${roundData.round}`;
  document.getElementById('teeTime').textContent=String(roundData.teeTime||'TBD').toUpperCase();
}

async function loadLeaderboard(){
  const host=document.getElementById('rows');
  const hadCache=showCachedLeaderboard();

  if(!hadCache){
    host.innerHTML='<div class="empty">Loading leaderboard…</div>';
  }

  document.getElementById('updated').textContent='UPDATING…';
  document.getElementById('updated').classList.remove('error');

  try{
    const tourRequests=[];
    for(let r=1;r<=currentRound;r++){
      tourRequests.push(apiJsonp({service:'scorecards',action:'leaderboard',round:r}));
    }

    const [leaderboard,roundPayload,tourBoards]=await Promise.all([
      apiJsonp({service:'scorecards',action:'leaderboard',round:currentRound}),
      apiJsonp({service:'scorecards',action:'round',round:currentRound}),
      Promise.all(tourRequests)
    ]);

    currentTourStandings=tourStandingsFrom(tourBoards);
    renderRows(leaderboard);
    updateMeta(roundPayload.round);
    saveCachedLeaderboard(currentRound,leaderboard);

    document.getElementById('updated').textContent='✓ UPDATED';
    document.getElementById('updatedTime').textContent='JUST NOW';
  }catch(error){
    console.error(error);

    if(hadCache){
      document.getElementById('updated').textContent='⚠ LAST KNOWN';
      document.getElementById('updatedTime').textContent='NETWORK UNAVAILABLE';
    }else{
      document.getElementById('updated').textContent='⚠ DATA ERROR';
      document.getElementById('updated').classList.add('error');
      document.getElementById('updatedTime').textContent='NO CACHED DATA';
    }
  }
}

document.getElementById('roundSelect').addEventListener('change',e=>{
  currentRound=Number(e.target.value)||1;
  history.replaceState(null,'',`leaderboard-st-andrews.html?round=${currentRound}`);
  updateLinks();
  loadLeaderboard();
});


currentRound=queryRound();
document.getElementById('roundSelect').value=String(currentRound);
updateLinks();
loadLeaderboard();
</script>
<!-- SGT26 St Andrews Leaderboard V2.3: final lower-left alignment pass -->
</body>
</html>
